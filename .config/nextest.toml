# cargo-nextest's configuration (https://nexte.st/docs/configuration/). CI runs the workspace's
# tests with nextest, split into partitions over several runners (docs/releasing.md › How CI runs
# the tests); `cargo test --workspace` stays the local check and runs the same tests.
#
# nextest runs every test in a process of its own, and tests of different binaries at the same
# time. A test that takes turns with others through a lock inside its binary (a `static Mutex`)
# no longer waits for them, so such a binary goes in a test group of one thread below.

[profile.default]
# Every test runs and every failing one is reported: a failure does not stop the tests that do not
# depend on it.
fail-fast = false
# Lists the tests that run for a minute or more while they run; nothing is stopped.
slow-timeout = { period = "60s" }

[profile.ci]
# A failure's output is shown when it happens and again at the end of the run.
failure-output = "immediate-final"

# A pull request that changes none of the shipped pack's inputs leaves out the pack's data audits:
# every amp model and every stock preset that names a file (ci.yml's `changes` job lists the
# inputs). They check files that rarely change, not code the pull request touched: in the 300
# merges to main before 2026-11-18, 61 changed what they read. The amp modeler's own tests render a
# WaveNet and an LSTM model on every pull request. The merge queue and main run the audits (the `ci`
# profile), so nothing merges without them.
[profile.ci-pr]
inherits = "ci"
default-filter = """
not (package(suhina-device-registry) & binary(=pack) & (
    test(=every_pack_amp_model_runs_the_device)
    | test(=every_stock_preset_naming_a_file_renders_heard_and_under_full_scale)
))
"""

[test-groups]
# A test's sweep removes the files of another test's finished peer (crates/ipc/tests/leftovers.rs).
ipc-leftovers = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(suhina-ipc) & binary(=leftovers)"
test-group = "ipc-leftovers"
