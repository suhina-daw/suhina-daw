[workspace]
resolver = "3"
members = ["crates/*", "devices/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
# internal
suhina-model = { path = "crates/model" }
suhina-engine = { path = "crates/engine" }
suhina-als = { path = "crates/als" }
suhina-flp = { path = "crates/flp" }
suhina-project-file = { path = "crates/project-file" }
suhina-session = { path = "crates/session" }
suhina-automation = { path = "crates/automation" }
suhina-media = { path = "crates/media" }
suhina-library = { path = "crates/library" }
suhina-dsp = { path = "crates/dsp" }
suhina-device-api = { path = "crates/device-api" }
suhina-device-sdk = { path = "crates/device-sdk" }
suhina-ipc = { path = "crates/ipc" }
suhina-plugins = { path = "crates/plugins" }
suhina-device-utility = { path = "devices/utility" }
suhina-device-auto-pan = { path = "devices/auto-pan" }
suhina-device-dj-eq = { path = "devices/dj-eq" }
suhina-device-vinyl-distortion = { path = "devices/vinyl-distortion" }
suhina-device-overdrive = { path = "devices/overdrive" }
suhina-device-fm-synth = { path = "devices/fm-synth" }
suhina-device-compressor = { path = "devices/compressor" }
suhina-device-limiter = { path = "devices/limiter" }
suhina-device-nam-amp-modeler = { path = "devices/nam-amp-modeler" }
suhina-device-nam-cab-loader = { path = "devices/nam-cab-loader" }
suhina-device-registry = { path = "crates/device-registry" }
suhina-stretch = { path = "crates/stretch" }
suhina-output = { path = "crates/output" }
suhina-realtime = { path = "crates/realtime" }
suhina-midi = { path = "crates/midi" }
suhina-ui = { path = "crates/ui" }
suhina-soundmap = { path = "crates/soundmap" }
suhina-separation = { path = "crates/separation" }
suhina-update = { path = "crates/update" }

# external (licences must be GPLv3-compatible)
hound = "3.5"  # Apache-2.0
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }  # MIT OR Apache-2.0
base64 = "0.23"  # MIT OR Apache-2.0
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }  # MIT
# The version information in the Windows executables (their build scripts).
winresource = { version = "0.1", default-features = false }  # MIT
roxmltree = "0.21"  # MIT OR Apache-2.0
cpal = "0.18"  # Apache-2.0
serde_json = "1"  # MIT OR Apache-2.0
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # MIT OR Apache-2.0
serde = { version = "1", features = ["derive"] }  # MIT OR Apache-2.0
nam-rs = "0.4"  # MIT; NAM model inference for the two NAM devices
rtrb = "0.4"  # MIT OR Apache-2.0
midir = "0.11"  # MIT
notify-debouncer-full = "0.7"  # MIT OR Apache-2.0; with notify (CC0-1.0)
memory-stats = "1.2"  # MIT; the process's RAM, for the control bar

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
