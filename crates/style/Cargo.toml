[package]
name = "suhina-style"
description = "Bounded native style sheets and source-preserving edits, independent of the UI toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cssparser = "0.37" # MPL-2.0; CSS syntax tokens, no browser engine
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] } # MIT; native layout only

[lints]
workspace = true
