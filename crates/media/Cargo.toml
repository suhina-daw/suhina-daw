[package]
name = "suhina-media"
description = "Finds and decodes the audio files a Suhina project uses"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
suhina-model.workspace = true
suhina-mp3.workspace = true  # GPL-3.0-or-later: the vendored LAME 3.100 encoder behind a safe API
serde_json.workspace = true
base64.workspace = true
hound.workspace = true  # Apache-2.0: WAV (PCM and float) writing for export and previews
# Apache-2.0: pure Rust FLAC encoder (no parallel feature, so one thread and deterministic)
flacenc = { version = "0.5", default-features = false }
# BSD-3-Clause: bindings to libvorbis (BSD-3-Clause, aoTuV/Lancer) and libogg (BSD-3-Clause);
# no stream-serial-rng, so an Ogg export is byte-reproducible
vorbis_rs = { version = "0.5", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac"] }  # MPL-2.0

[dev-dependencies]
suhina-device-compressor.workspace = true
suhina-device-limiter.workspace = true
hound.workspace = true
memory-stats.workspace = true

[lints]
workspace = true
