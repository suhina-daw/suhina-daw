[package]
name = "suhina-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Laboratory only; does not enable render-ahead in the desktop application.
render-path-prototype = []

[[example]]
name = "render_path_probe"
required-features = ["render-path-prototype"]

[dependencies]
suhina-model.workspace = true
suhina-stretch.workspace = true
suhina-device-api.workspace = true
suhina-device-sdk.workspace = true
suhina-dsp.workspace = true
# Waiting for several plug-ins' answers at once (#1256).
suhina-ipc.workspace = true
rtrb.workspace = true
# Render workers join real-time priority as the render thread does.
suhina-realtime.workspace = true

[lints]
workspace = true

[dev-dependencies]
allocation-counter = "0.8.1" # MIT OR Apache-2.0; the render thread allocates nothing (ADR 0038 › 2)
suhina-device-registry.workspace = true
suhina-test-support.workspace = true
