[package]
name = "suhina-output"
description = "Plays a Suhina engine on an audio output device: lists the hosts and devices, opens the one chosen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# ASIO on Windows, through cpal's asio host. Building it compiles the Steinberg ASIO SDK
# (GPL-3.0 since 2025, vendored in third_party/asiosdk) with a C++ compiler and generates its
# bindings with bindgen, which needs libclang (README › Building).
asio = ["cpal/asio"]

[dependencies]
suhina-engine.workspace = true
suhina-session.workspace = true
cpal.workspace = true
# The ring the engine renders ahead into, read by the device's callback.
rtrb.workspace = true
# Real-time priority for the render thread.
suhina-realtime.workspace = true

[target.'cfg(windows)'.dependencies]
# WASAPI in exclusive mode, which cpal does not open.
wasapi = "0.26"  # MIT

[dev-dependencies]
suhina-model.workspace = true

[lints]
workspace = true
