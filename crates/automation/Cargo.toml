[package]
name = "suhina-automation"
description = "MCP server over a Suhina session, plus offline rendering to WAV"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
suhina-engine.workspace = true
suhina-session.workspace = true
suhina-media.workspace = true
suhina-library.workspace = true
hound.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }  # MIT OR Apache-2.0
schemars = "1"  # MIT
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }  # Apache-2.0
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }  # MIT

[lints]
workspace = true
