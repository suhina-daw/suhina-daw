[package]
name = "suhina-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
memmap2 = "0.9"  # MIT OR Apache-2.0

[target.'cfg(unix)'.dependencies]
libc = "0.2"  # MIT OR Apache-2.0

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }  # MIT OR Apache-2.0

# The workspace lints, except that this crate may use `unsafe` (ADR 0006). It cannot inherit
# them with `workspace = true` and change one, so they are repeated here; keep them in step.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
