name: Claim

# `/claim`, `/unclaim`, `/hold` and `/ready` move an issue's card on the Suhina project board, so
# that taking a task (CONTRIBUTING.md › Working on an issue) needs no maintainer in the loop: a
# claim lives in the project's Status field, and someone from outside the organization cannot write
# it. The bot also makes the checks a claimer would otherwise make by hand — an open pull request
# that closes the issue, a status that says someone is already on it, a status that says the work is
# not to be started — and refuses the claim for them, saying which one it found.
#
# A maintainer may write `/claim @login` to claim for someone else: the same checks run for that
# person, who is assigned, and the answer says a maintainer claimed on their behalf.
#
# A claim is refused while an issue it is *Blocked by* is open. A `Touches:` line in the claim names
# the paths the work will change, and the answer lists the open pull requests and other claims that
# touch the same paths, so overlapping work is found before it is written twice (AGENTS.md › Tasks).
#
# Who may do what is named, not taken from GitHub's author association (every collaborator with
# triage access is a `COLLABORATOR` there): maintainers are listed in `MAINTAINERS` below, and the
# repository variable `TRUSTED_CONTRIBUTORS` lists contributors who may claim a feature still in
# Backlog. Anyone who is not a maintainer holds at most `MAX_OPEN_CLAIMS` claims without a pull
# request at a time.
#
# It needs the repository secret `PROJECT_TOKEN`, because the workflow's `GITHUB_TOKEN` cannot
# reach a project owned by the organization. docs/claim-bot.md says how to make one, which
# scopes it needs and what happens when it expires.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  claim:
    # A pull request comment is not an issue claim, a closed issue keeps no claim, and the bot's
    # own comments must never start another round. Only a comment that starts with `/` can be a
    # command: other comments start no run, so they never take a command's place in the queue below
    # (GitHub keeps one pending run per group and cancels the one before it).
    if: >-
      startsWith(github.event.comment.body, '/') &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot'
    # The board's Status is one value: two commands at the same moment would race for it.
    concurrency: claim-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          PROJECT_OWNER: suhina-daw
          PROJECT_NUMBER: "1"
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Logins, separated by commas or spaces. The maintainers are also listed in
          # ready-to-merge.yml, test-build.yml and test-build-links.yml; a change to them is a pull request:
          # trusted contributors are a repository variable, so adding one needs no change here.
          MAINTAINERS: juhamikael
          TRUSTED_CONTRIBUTORS: ${{ vars.TRUSTED_CONTRIBUTORS }}
        with:
          script: |
            const owner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const projectToken = process.env.PROJECT_TOKEN;

            // The board's own words, and the only place they are written down. The Suhina project
            // has Backlog, Ready, In progress, In review and Done, plus the gate this bot writes: a
            // card is free when its Status says so, `Do not start yet` is a deliberate gate rather
            // than a claim, `In progress` and `In review` mean someone is on it, and every other
            // value is not open to start. Comparisons ignore case, so a board that spells a status
            // "In Progress" still works.
            const FREE = ["Backlog", "Ready"];
            const NOT_READY = ["Do not start yet"];
            const WORKING = ["In progress", "In review"];
            const CLAIMED = "In progress";
            // Where a released card goes, so that it can be taken again.
            const RELEASED = "Ready";
            // A claim with no pull request after this long has lapsed, and the next `/claim` takes it
            // over (CONTRIBUTING.md › Working on an issue). A draft pull request is enough to keep it.
            const LAPSE_HOURS = 48;
            // How many claims without a pull request one person who is not a maintainer may hold at
            // once: open issues assigned to them that no open pull request closes.
            const MAX_OPEN_CLAIMS = 5;

            const issue = context.payload.issue;
            // Assignees and labels are read again rather than taken from the event, which is as old
            // as the comment: a `/unclaim` queued behind the same person's `/claim` must see the claim.
            let current = issue;
            try {
              current = (await github.rest.issues.get({ ...context.repo, issue_number: issue.number })).data;
            } catch (error) {
              core.warning(`Could not read the issue again: ${error.message}`);
            }
            const comment = context.payload.comment;
            const actor = comment.user.login;
            // The two lists of logins, compared without case. GitHub's author association is not
            // used: it calls every collaborator, triage access included, a `COLLABORATOR`.
            const logins = (text) =>
              String(text || "")
                .split(/[\s,]+/)
                .map((login) => login.replace(/^@/, "").toLowerCase())
                .filter((login) => login.length > 0);
            const maintainers = logins(process.env.MAINTAINERS);
            const isMaintainer = (login) => typeof login === "string" && maintainers.includes(login.toLowerCase());
            const maintainer = isMaintainer(actor);
            // A trusted contributor may claim a feature still in Backlog; nothing else changes for them.
            const trusted = maintainer || logins(process.env.TRUSTED_CONTRIBUTORS).includes(actor.toLowerCase());

            const body = (comment.body || "").trim();
            const head = body.split("\n")[0].trim().match(/^\/(claim|unclaim|hold|ready)\b/i);
            if (!head) return;
            const command = head[1].toLowerCase();
            // Everything after the command: the plan of a `/claim`, or why a `/hold` holds.
            const argument = body.replace(/^\/[a-z]+\b/i, "").replace(/\s+/g, " ").trim();
            // `/claim @login …`: a maintainer claims for someone else. GitHub logins are letters,
            // digits and single hyphens, up to 39 characters, never starting or ending with a hyphen.
            // The name only ever reaches the API as a value, but it is checked anyway, so a typo is
            // answered instead of assigning nobody.
            const LOGIN = /^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$/;
            const sameLogin = (a, b) => typeof a === "string" && typeof b === "string" && a.toLowerCase() === b.toLowerCase();
            const named = command === "claim" ? argument.match(/^@(\S+)/) : null;
            const target = named ? named[1].replace(/[,.:;!?]+$/, "") : null;

            const slug = `${context.repo.owner}/${context.repo.repo}`;
            const boardUrl = `${context.serverUrl}/orgs/${owner}/projects/${projectNumber}`;
            const firstIssues =
              `${context.serverUrl}/${slug}/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22`;
            const say = (text) =>
              github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: text,
              });

            if (target !== null && !LOGIN.test(target)) {
              // The text is not quoted back: it is whatever followed the `@`, and may itself mention someone.
              return say(
                `@${actor}, the name after \`/claim\` is not a GitHub username (letters, digits and ` +
                  `single hyphens, up to 39 characters), so nothing was claimed. Write it like ` +
                  `\`/claim @octocat Plan: …\`.`,
              );
            }
            // `Touches: crates/ui/src/piano_roll, crates/session` in a claim: the paths the work will
            // change, on a line of its own or after the plan (a `Plan:` or `When:` after it ends it).
            // At most 20, each a plain relative path; a trailing `/`, `/*` or `/**` is dropped and
            // anything else on the line is ignored, so nobody's text reaches a query as written.
            const PATH = /^[A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)*$/;
            const touchedPaths = (text) => {
              const line = String(text || "").match(/\bTouches:[ \t]*([^\n]*)/i);
              if (!line) return [];
              const paths = [];
              for (const word of line[1].split(/\s+(?:Plan|When):/i)[0].split(/[\s,;]+/)) {
                const path = word
                  .replace(/[`"']/g, "")
                  .replace(/^\.\//, "")
                  .replace(/(?:\/\*\*|\/\*|\/)+$/, "");
                const plain = PATH.test(path) && !path.split("/").some((part) => part === "." || part === "..");
                if (plain && !paths.includes(path)) paths.push(path);
                if (paths.length === 20) break;
              }
              return paths;
            };
            // Two paths overlap when one is the other or lies under it.
            const overlaps = (a, b) => a === b || a.startsWith(`${b}/`) || b.startsWith(`${a}/`);
            const touches = command === "claim" ? touchedPaths(body) : [];

            // Claiming for oneself by name is an ordinary claim.
            const onBehalf = target !== null && !sameLogin(target, actor);
            if (onBehalf && !maintainer) {
              return say(
                `Only a maintainer can claim an issue for someone else, @${actor}; you may claim it ` +
                  `for yourself with \`/claim\` and your plan.`,
              );
            }
            // Who the claim is for: the commenter, or the person a maintainer named.
            const claimant = onBehalf ? target : actor;

            if (!projectToken) {
              // No secret, no card movement. Say so rather than leaving the claimer guessing: the
              // comment itself is still the claim (CONTRIBUTING.md › Working on an issue).
              core.warning("PROJECT_TOKEN is not set; see docs/claim-bot.md.");
              return say(
                `Command noted, @${actor} — but the board has no \`PROJECT_TOKEN\` secret, so a ` +
                  `maintainer has to move this card by hand: ${boardUrl}`,
              );
            }

            const project = getOctokit(projectToken);

            // The Status field, its options, and this issue's card on the board, in one round trip.
            try {
              const board = await project.graphql(
                `query ($issue: ID!, $owner: String!, $number: Int!) {
                   organization(login: $owner) {
                     projectV2(number: $number) {
                       id
                       field(name: "Status") {
                         ... on ProjectV2SingleSelectField { id options { id name } }
                       }
                     }
                   }
                   node(id: $issue) {
                     ... on Issue {
                       projectItems(first: 20) {
                         nodes {
                           id
                           project { id }
                           fieldValueByName(name: "Status") {
                             ... on ProjectV2ItemFieldSingleSelectValue { name }
                           }
                         }
                       }
                     }
                   }
                 }`,
                { issue: issue.node_id, owner, number: projectNumber },
              );

              const projectV2 = board.organization && board.organization.projectV2;
              const field = projectV2 && projectV2.field;
              if (!projectV2 || !field) {
                core.setFailed(`No project ${owner}/${projectNumber} with a Status field is visible to PROJECT_TOKEN.`);
                return say(
                  `@${actor}, the claim bot cannot see the board (its token may have expired) — ` +
                    `a maintainer has to move this card by hand: ${boardUrl}`,
                );
              }

              const same = (a, b) => typeof a === "string" && a.toLowerCase() === b.toLowerCase();
              const optionId = (name) => {
                const found = (field.options || []).find((option) => same(option.name, name));
                return found ? found.id : null;
              };
              // Open pull requests that say `Closes #N` for this issue; none when the lookup fails.
              const openPullRequests = async () => {
                try {
                  const linked = await project.graphql(
                    `query ($issue: ID!) {
                       node(id: $issue) {
                         ... on Issue {
                           closedByPullRequestsReferences(first: 10, includeClosedPrs: false) {
                             nodes { number title url }
                           }
                         }
                       }
                     }`,
                    { issue: issue.node_id },
                  );
                  return (
                    (linked.node &&
                      linked.node.closedByPullRequestsReferences &&
                      linked.node.closedByPullRequestsReferences.nodes) ||
                    []
                  );
                } catch (error) {
                  core.warning(`Could not look for linked pull requests: ${error.message}`);
                  return [];
                }
              };
              // How an issue or pull request is named in an answer: `#N` here, `owner/repo#N` elsewhere.
              const reference = (other) =>
                other.repository && other.repository.nameWithOwner && other.repository.nameWithOwner !== slug
                  ? `${other.repository.nameWithOwner}#${other.number}`
                  : `#${other.number}`;
              // Open issues this one is *Blocked by* (the issue's Relationships on GitHub): work that
              // has to be done first. None when the lookup fails, as with pull requests above.
              const openBlockers = async () => {
                try {
                  const found = await project.graphql(
                    `query ($issue: ID!) {
                       node(id: $issue) {
                         ... on Issue {
                           blockedBy(first: 20) {
                             nodes { number title state repository { nameWithOwner } }
                           }
                         }
                       }
                     }`,
                    { issue: issue.node_id },
                  );
                  const nodes = (found.node && found.node.blockedBy && found.node.blockedBy.nodes) || [];
                  return nodes.filter((blocker) => blocker && blocker.state === "OPEN");
                } catch (error) {
                  core.warning(`Could not read what blocks this issue: ${error.message}`);
                  return [];
                }
              };
              // Other open work on the claimed paths: pull requests whose changed files lie under
              // them (a pull request that closes this issue is not other work), and other issues
              // whose newest claim, still assigned and not taken back with `/unclaim`, has a
              // `Touches:` line that overlaps them. A notice for the claimer, never a refusal, so a
              // lookup that fails only leaves its part out.
              const otherWork = async (paths) => {
                const found = [];
                try {
                  const open = await project.graphql(
                    `query ($owner: String!, $name: String!) {
                       repository(owner: $owner, name: $name) {
                         pullRequests(states: OPEN, first: 100, orderBy: { field: UPDATED_AT, direction: DESC }) {
                           nodes {
                             number title
                             files(first: 100) { nodes { path } }
                             closingIssuesReferences(first: 10) { nodes { number } }
                           }
                         }
                       }
                     }`,
                    { owner: context.repo.owner, name: context.repo.repo },
                  );
                  const pulls =
                    (open.repository && open.repository.pullRequests && open.repository.pullRequests.nodes) || [];
                  for (const pull of pulls) {
                    const closes = ((pull.closingIssuesReferences && pull.closingIssuesReferences.nodes) || [])
                      .some((closed) => closed.number === issue.number);
                    if (closes) continue;
                    const files = ((pull.files && pull.files.nodes) || []).map((file) => file.path);
                    const hit = files.filter((file) => paths.some((path) => overlaps(file, path)));
                    if (hit.length > 0) found.push({ name: `#${pull.number}`, title: pull.title, hit });
                  }
                } catch (error) {
                  core.warning(`Could not read the open pull requests' files: ${error.message}`);
                }
                try {
                  // A claim assigns the claimer, so the open issues with someone assigned are the
                  // claims; the 50 most recently updated are read.
                  const result = await github.rest.issues.listForRepo({
                    ...context.repo,
                    state: "open",
                    assignee: "*",
                    sort: "updated",
                    direction: "desc",
                    per_page: 50,
                  });
                  const others = ((result && result.data) || []).filter(
                    (other) => other.number !== issue.number && !other.pull_request,
                  );
                  for (const other of others) {
                    const comments = await github.paginate(github.rest.issues.listComments, {
                      ...context.repo,
                      issue_number: other.number,
                      per_page: 100,
                    });
                    const commands = comments.filter((entry) => /^\/(un)?claim\b/i.test((entry.body || "").trim()));
                    const newest = commands.pop();
                    if (!newest || /^\/unclaim\b/i.test(newest.body.trim())) continue;
                    const theirs = touchedPaths(newest.body);
                    const hit = theirs.filter((path) => paths.some((mine) => overlaps(path, mine)));
                    if (hit.length > 0) found.push({ name: `#${other.number}`, title: other.title, hit, claim: true });
                  }
                } catch (error) {
                  core.warning(`Could not read the other claims: ${error.message}`);
                }
                return found;
              };
              // What the claim's answer says about other work on the same code.
              const overlapNote = async () => {
                if (touches.length === 0) {
                  return (
                    "\n\nA `Touches:` line in the claim, naming the paths you will change " +
                    "(`Touches: crates/ui/src/piano_roll, crates/session`), makes this bot list other " +
                    "open work on the same code."
                  );
                }
                const found = await otherWork(touches);
                const named = touches.slice(0, 5).map((path) => `\`${path}\``).join(", ");
                if (found.length === 0) {
                  return `\n\nNo other open pull request or claim touches ${named}${touches.length > 5 ? ", …" : ""}.`;
                }
                const lines = found.slice(0, 10).map((entry) => {
                  const where = entry.hit.slice(0, 3).map((path) => `\`${path}\``).join(", ");
                  const more = entry.hit.length > 3 ? `, and ${entry.hit.length - 3} more` : "";
                  return `- ${entry.name} ${entry.title}${entry.claim ? " (a claim)" : ""}: ${where}${more}`;
                });
                if (found.length > 10) lines.push(`- and ${found.length - 10} more`);
                return (
                  `\n\nOther open work touches the same code:\n\n${lines.join("\n")}\n\n` +
                  `Read it before you start. When it builds something you need, build on it (stack on its ` +
                  `branch, or write \`Depends on #N\` in your pull request) rather than writing it again; ` +
                  `when it changes the same code for another reason, say so in both (AGENTS.md › Tasks).`
                );
              };
              const isFree = (name) => FREE.some((free) => same(name, free));
              const isNotReady = (name) => NOT_READY.some((held) => same(name, held));
              const isWorking = (name) => WORKING.some((working) => same(name, working));
              const item =
                ((board.node && board.node.projectItems && board.node.projectItems.nodes) || []).find(
                  (node) => node.project.id === projectV2.id,
                ) || null;
              const status =
                (item && item.fieldValueByName && item.fieldValueByName.name) || null;
              const assignees = (current.assignees || []).map((user) => user.login);
              const mentions = assignees.map((login) => `@${login}`).join(", ");
              const hasClaimant = assignees.some((login) => sameLogin(login, claimant));
              // The claimant as GitHub spells them when they are assigned already, as written otherwise.
              const who = assignees.find((login) => sameLogin(login, claimant)) || claimant;

              const setStatus = (itemId, name) =>
                project.graphql(
                  `mutation ($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                     updateProjectV2ItemFieldValue(input: {
                       projectId: $project, itemId: $item, fieldId: $field,
                       value: { singleSelectOptionId: $option }
                     }) { projectV2Item { id } }
                   }`,
                  { project: projectV2.id, item: itemId, field: field.id, option: optionId(name) },
                );

              // Every command that moves a card needs one, and an issue that was never put on the
              // board gets a card now rather than a refusal.
              const ensureItem = async () => {
                if (item && item.id) return item.id;
                const added = await project.graphql(
                  `mutation ($project: ID!, $content: ID!) {
                     addProjectV2ItemById(input: { projectId: $project, contentId: $content }) {
                       item { id }
                     }
                   }`,
                  { project: projectV2.id, content: issue.node_id },
                );
                return added.addProjectV2ItemById.item.id;
              };

              // A renamed or missing option is worth naming: the comment then carries its own fix.
              const requireOption = async (name) => {
                if (optionId(name)) return true;
                const names = (field.options || []).map((option) => option.name).join(", ");
                core.setFailed(`The board's Status field has no option called ${name}; it has: ${names}`);
                await say(
                  `@${actor}, the board's Status field has no **${name}** option (it has: ${names}), ` +
                    `so a maintainer has to move this card by hand: ${boardUrl}`,
                );
                return false;
              };

              // The reason a maintainer gave with `/hold`, so a refusal can quote the gate instead
              // of only naming it. Only a maintainer's `/hold` counts: anyone else's was refused, and
              // quoting it would let anyone make the bot repeat their words. Every page is read, so the
              // newest hold wins on a long thread, and `@` is dropped so a quote pings nobody.
              const holdReason = async () => {
                try {
                  const comments = await github.paginate(github.rest.issues.listComments, {
                    ...context.repo,
                    issue_number: issue.number,
                    per_page: 100,
                  });
                  const held = comments
                    .filter((entry) => entry.user && isMaintainer(entry.user.login))
                    .filter((entry) => /^\/hold\b/i.test((entry.body || "").trim()))
                    .pop();
                  if (!held) return "";
                  const why = (held.body || "")
                    .replace(/^\/[a-z]+\b/i, "")
                    .replace(/@/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
                  if (!why) return "";
                  return `“${why.length > 200 ? `${why.slice(0, 197)}…` : why}”`;
                } catch (error) {
                  core.warning(`Could not read the hold reason: ${error.message}`);
                  return "";
                }
              };

              // When this bot last wrote "Claimed by" here, or null: the age of the current claim. A
              // claim made only in a plain comment has no such time, and never lapses on its own.
              const claimedAt = async () => {
                try {
                  const comments = await github.paginate(github.rest.issues.listComments, {
                    ...context.repo,
                    issue_number: issue.number,
                    per_page: 100,
                  });
                  const claim = comments
                    .filter((entry) => entry.user && entry.user.type === "Bot")
                    .filter((entry) => (entry.body || "").startsWith("Claimed by @"))
                    .pop();
                  const at = claim ? Date.parse(claim.created_at) : NaN;
                  return Number.isNaN(at) ? null : at;
                } catch (error) {
                  core.warning(`Could not read when this was claimed: ${error.message}`);
                  return null;
                }
              };

              if (command === "hold" || command === "ready") {
                if (!maintainer) {
                  return say(`Only a maintainer can hold or release an issue, @${actor}.`);
                }
                if (command === "hold" && !argument) {
                  return say(
                    "Write the reason after the command, like `/hold waiting for ADR 0003`, so that " +
                      "the issue itself says why it is gated — the card only carries the instruction.",
                  );
                }
                const target = command === "hold" ? NOT_READY[0] : RELEASED;
                if (!(await requireOption(target))) return;
                await setStatus(await ensureItem(), target);
                return say(
                  command === "hold"
                    ? `Held: the card is **${target}** on the [board](${boardUrl}). The reason above ` +
                        `is the one the next person reads, so thank you for writing it down.`
                    : `Released: the card is **${RELEASED}** on the [board](${boardUrl}), so anyone ` +
                        `may claim it again.`,
                );
              }

              if (command === "unclaim") {
                if (!maintainer && !assignees.includes(actor)) {
                  return say(
                    `Only the person who claimed this (${mentions || "nobody yet"}) or a maintainer ` +
                      `can release it.`,
                  );
                }
                // A maintainer releases whoever claimed it; anyone else releases only themselves.
                const leaving = maintainer ? assignees : [actor];
                // Only a claim goes back to Ready. A held card stays held and a card in review stays
                // in review: unclaiming must not open what a maintainer gated or what waits for review.
                const claimed = item && same(status, CLAIMED);
                if (!claimed && leaving.length === 0) {
                  return say(`@${actor}, this issue is already free.`);
                }
                if (claimed) {
                  if (!(await requireOption(RELEASED))) return;
                  await setStatus(item.id, RELEASED);
                }
                if (leaving.length > 0) {
                  try {
                    await github.rest.issues.removeAssignees({
                      ...context.repo,
                      issue_number: issue.number,
                      assignees: leaving,
                    });
                  } catch (error) {
                    // The card is the signal that matters; a failed unassign is worth a warning only.
                    core.warning(`Could not unassign ${leaving.join(", ")}: ${error.message}`);
                  }
                }
                if (claimed) {
                  return say(
                    `Released by @${actor}: back to **${RELEASED}** on the [board](${boardUrl}). ` +
                      `Thank you for saying so: that is exactly the signal the next person needs.`,
                  );
                }
                return say(
                  `Unassigned by @${actor}. The card stays **${status || "without a status"}** on the ` +
                    `[board](${boardUrl}); only a claim in **${CLAIMED}** goes back to **${RELEASED}**.`,
                );
              }

              if ((current.labels || []).some((label) => label.name === "epic")) {
                return say(
                  "An `epic` is a container for other issues, not a task to claim: claim one of its issues instead.",
                );
              }

              // A feature request in Backlog is not agreed yet: a maintainer moves it to Ready (`/ready`)
              // once Suhina wants it, so two people never start the same idea in two shapes. A bug in
              // Backlog is free, and a maintainer or a trusted contributor may claim either.
              const feature = (current.labels || []).some((label) => label.name === "enhancement");
              if (feature && !trusted && (!item || status === null || same(status, "Backlog"))) {
                return say(
                  `This feature is not agreed yet (**${status || "Backlog"}**), so it is not open to ` +
                    `claim. Write your plan in this issue; a maintainer moves it to **${RELEASED}** with ` +
                    `\`/ready\` when Suhina wants it, and then \`/claim\` works.`,
                );
              }

              // One person who is not a maintainer holds at most MAX_OPEN_CLAIMS claims without a pull
              // request: the open issues assigned to them that no open pull request closes, this one
              // left out. A claim they have already, and a maintainer's claim for someone, are not
              // new claims. A lookup that fails lets the claim go ahead.
              if (!maintainer && !hasClaimant) {
                let waiting = [];
                try {
                  const theirs = await project.graphql(
                    `query ($owner: String!, $name: String!, $login: String!) {
                       repository(owner: $owner, name: $name) {
                         issues(states: OPEN, first: 100, filterBy: { assignee: $login }) {
                           nodes {
                             number title
                             closedByPullRequestsReferences(first: 1, includeClosedPrs: false) { totalCount }
                           }
                         }
                       }
                     }`,
                    { owner: context.repo.owner, name: context.repo.repo, login: claimant },
                  );
                  const nodes = (theirs.repository && theirs.repository.issues && theirs.repository.issues.nodes) || [];
                  waiting = nodes.filter(
                    (other) =>
                      other.number !== issue.number &&
                      !(other.closedByPullRequestsReferences && other.closedByPullRequestsReferences.totalCount > 0),
                  );
                } catch (error) {
                  core.warning(`Could not count the open claims of @${claimant}: ${error.message}`);
                }
                if (waiting.length >= MAX_OPEN_CLAIMS) {
                  const list = waiting.slice(0, 10).map((other) => `- #${other.number} ${other.title}`).join("\n");
                  return say(
                    `@${actor}, you hold ${waiting.length} claims without a pull request, and the limit is ` +
                      `${MAX_OPEN_CLAIMS}:\n\n${list}\n\nOpen a draft pull request that says \`Closes #N\` ` +
                      `for one of them, or comment \`/unclaim\` on one you will not do now, and then ` +
                      `\`/claim\` works here.`,
                  );
                }
              }

              if (item && isNotReady(status)) {
                const reason = await holdReason();
                return say(
                  `This is held — the card says **${status}**${reason ? `: ${reason}` : ""}. Please ` +
                    `take another one; the [good first issues](${firstIssues}) are a good start. ` +
                    `If the reason is not clear, ask in this issue rather than starting.`,
                );
              }

              // Work that has to be done first gates a claim the way a hold does. The person who has
              // the claim already is answered below instead, so a second session of theirs is pointed
              // at the work that exists.
              const mine = item && same(status, CLAIMED) && assignees.length === 1 && hasClaimant;
              if (!mine) {
                const blockers = await openBlockers();
                if (blockers.length > 0) {
                  const list = blockers.map((blocker) => `- ${reference(blocker)} ${blocker.title}`).join("\n");
                  return say(
                    `This is blocked by work that has to be done first:\n\n${list}\n\nClaim one of those ` +
                      `instead, or ask in this issue if the order is wrong. Once they are closed, ` +
                      `\`/claim\` works here.`,
                  );
                }
              }

              // A card without a Status yet is free, as it is for `/unclaim`.
              let lapsed = false;
              if (item && status !== null && !isFree(status)) {
                if (same(status, CLAIMED) && assignees.length === 1 && hasClaimant) {
                  // Often a second session of the same person, or an agent started twice: point it at
                  // the work that exists, so it continues there instead of opening a second pull request.
                  const open = await openPullRequests();
                  const list = open.map((pr) => `- #${pr.number} ${pr.title}`).join("\n");
                  if (onBehalf) {
                    return say(
                      `@${actor}, this is already **${CLAIMED}** for @${who}` +
                        (open.length > 0 ? `, with a pull request:\n\n${list}` : "; nothing changed."),
                    );
                  }
                  return say(
                    `@${actor}, this one is already yours` +
                      (open.length > 0
                        ? `, and it has a pull request:\n\n${list}\n\nContinue there rather than opening another one.`
                        : ". If another session of yours is on it, continue that work rather than starting again."),
                  );
                }
                // A claim in progress with no pull request after LAPSE_HOURS is free again: the
                // claimer is unassigned here and the claim below goes ahead.
                if (same(status, CLAIMED) && !hasClaimant) {
                  const at = await claimedAt();
                  if (at !== null && Date.now() - at > LAPSE_HOURS * 3600 * 1000) {
                    lapsed = (await openPullRequests()).length === 0;
                  }
                }
                if (lapsed) {
                  if (assignees.length > 0) {
                    try {
                      await github.rest.issues.removeAssignees({
                        ...context.repo,
                        issue_number: issue.number,
                        assignees,
                      });
                    } catch (error) {
                      core.warning(`Could not unassign ${mentions}: ${error.message}`);
                    }
                  }
                  await say(
                    `The claim${mentions ? ` by ${mentions}` : ""} lapsed: no pull request in ` +
                      `${LAPSE_HOURS} hours. It passes to @${who}.`,
                  );
                }
              }
              if (item && status !== null && !isFree(status) && !lapsed) {
                const on = mentions ? ` (${mentions})` : "";
                const state = isWorking(status)
                  ? `already **${status}**${on}, so someone is on it`
                  : `**${status}**${on}, which is not open to start`;
                return say(
                  `This is ${state}. Please take another one — the [good first issues](${firstIssues}) ` +
                    `are a good start. A claim with no pull request lapses after ${LAPSE_HOURS} hours, and ` +
                    `then \`/claim\` takes it over; if its pull request has stalled, ask its author ` +
                    `there, and with no answer in three days you may take it over in that pull request.`,
                );
              }

              // A pull request that closes the issue has taken it, whatever the board says. This is a
              // courtesy check, not the gate: the board decides, so a failure here must not stop a
              // legitimate claim.
              const open = await openPullRequests();
              if (open.length > 0) {
                const list = open.map((pr) => `- #${pr.number} ${pr.title}`).join("\n");
                return say(
                  `There is already a pull request for this, so it is taken:\n\n${list}\n\n` +
                    `If it has stalled, ask its author there; with no answer in three days you may ` +
                    `take the work over in it (CONTRIBUTING.md › Working on an issue).`,
                );
              }

              if (!(await requireOption(CLAIMED))) return;
              await setStatus(await ensureItem(), CLAIMED);

              // Assigning is the second signal next to the card, and it can fail on its own (a user
              // who may not be assigned); the claim stands either way. GitHub skips, without an error,
              // someone it may not assign (no access, never commented here, or no such account), so
              // the answer checks the issue it gets back.
              let assigned = hasClaimant;
              if (!hasClaimant) {
                try {
                  const updated = await github.rest.issues.addAssignees({
                    ...context.repo,
                    issue_number: issue.number,
                    assignees: [claimant],
                  });
                  const now = (updated && updated.data && updated.data.assignees) || null;
                  assigned = now === null || now.some((user) => sameLogin(user.login, claimant));
                } catch (error) {
                  core.warning(`Could not assign @${claimant}: ${error.message}`);
                  assigned = false;
                }
              }
              const unassigned = assigned
                ? ""
                : `\n\nGitHub did not assign @${who} (it assigns only people with access to the ` +
                  `repository or who have commented on this issue), so the card is the only record ` +
                  `of the claim for now.`;

              return say(
                `Claimed by @${who}` +
                  (onBehalf ? `, on behalf of a maintainer (@${actor})` : "") +
                  `: **${CLAIMED}** on the [board](${boardUrl}).\n\n` +
                  `Please keep that true: open a draft pull request that says \`Closes #${issue.number}\` ` +
                  `within ${LAPSE_HOURS} hours, or the claim lapses and the next \`/claim\` takes it ` +
                  `over; comment \`/unclaim\` if you stop. A plan in a ` +
                  `comment — what you will change, and roughly when — helps whoever reviews it.` +
                  unassigned +
                  (await overlapNote()),
              );
            } catch (error) {
              // A token that expired, or a query the schema no longer answers, must not leave the
              // claimer in silence: the comment is still the claim, so say what happened.
              core.setFailed(`The claim bot failed: ${error.message}`);
              await say(
                `@${actor}, the claim bot could not do its job: ${error.message}. Your ` +
                  `comment still claims this issue, and a maintainer will move the card.`,
              );
            }
