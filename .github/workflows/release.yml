name: Release

# Builds the release binaries. A `v*` tag builds them and attaches them to a draft GitHub Release:
# `v0.1.0-rc.1` for a release candidate, `v0.1.0` for the release. Every night main is built as the
# nightly (and again 12 hours later), a release under the tag `nightly` that each new one replaces, so people can try the
# current state, and kept for NIGHTLY_KEEP_DAYS as its own pre-release `nightly-YYYYMMDD`, so a
# tester can go back to an earlier night; a night with no new commit on main builds nothing. Running the workflow by hand
# only builds the packages, as workflow artifacts, or with "nightly" publishes the nightly from main
# now. See docs/releasing.md.
# The binaries are not signed yet (ROADMAP, M8): macOS Gatekeeper and Windows SmartScreen warn
# about them.

on:
  push:
    tags: ["v*"]
  schedule:
    # The nightly every 12 hours: 02:17 and 14:17 UTC (05:17 and 17:17 in Finland in summer).
    - cron: "17 2 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish the build as the nightly (from main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: suhina-cli
  # The desktop app.
  APP: suhina
  # The process plug-ins run in (ADR 0006); suhina-cli and suhina look for it next to themselves.
  HOST: suhina-plugin-host
  # How long a night's own release, `nightly-YYYYMMDD`, is kept (docs/releasing.md › Nightly).
  NIGHTLY_KEEP_DAYS: 30

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      nightly: ${{ steps.version.outputs.nightly }}
      skip: ${{ steps.version.outputs.skip }}
      name: ${{ steps.version.outputs.name }}
      dated: ${{ steps.version.outputs.dated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Read the version and check the tag
        id: version
        shell: bash
        env:
          NIGHTLY_INPUT: ${{ inputs.nightly }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "suhina-cli") | .version')
          if [ -z "$version" ]; then
            echo "::error::could not read the suhina-cli version"
            exit 1
          fi
          # MAJOR.MINOR.PATCH, optionally with a release-candidate suffix: 0.1.0 or 0.1.0-rc.1.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::version $version is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          nightly=false
          dated=
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$NIGHTLY_INPUT" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::the nightly is built from main only"
              exit 1
            fi
            nightly=true
            # The night's build of this commit: 0.1.0-nightly.20261013+a15ad35. The commit is
            # build metadata, so a hash with a leading zero is still a valid version.
            day=$(date -u +%Y%m%d)
            version="${version%%-*}-nightly.$day+${GITHUB_SHA::7}"
            # The night's own release, kept after `nightly` has moved on. A day's second scheduled
            # build (the afternoon's) is kept beside its first as nightly-YYYYMMDD-2, and so on; a
            # run by hand replaces the day's first one, as before.
            dated="nightly-$day"
            n=2
            while [ -n "$(git ls-remote origin "refs/tags/$dated" | cut -f1)" ] \
              && [ "$GITHUB_EVENT_NAME" = "schedule" ]; do
              dated="nightly-$day-$n"
              n=$((n + 1))
            done
            # A scheduled night with nothing new on main builds nothing.
            built=$(git ls-remote origin refs/tags/nightly | cut -f1)
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$built" = "$GITHUB_SHA" ]; then
              echo "The nightly is already this commit, $GITHUB_SHA."
              skip=true
            fi
          fi
          # Release candidates and nightlies are pre-releases; a release, 0.x included, is the latest.
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          # Nightly packages keep one name, so a link to the latest one never changes.
          if [ "$nightly" = "true" ]; then name=nightly; else name="$version"; fi
          echo "Version $version, nightly $nightly, skip $skip"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "nightly=$nightly"
            echo "skip=$skip"
            echo "name=$name"
            echo "dated=$dated"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu runner, so the binary runs on older glibc versions too.
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # Both architectures, joined into one universal binary with lipo.
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: suhina-${{ needs.version.outputs.name }}-${{ matrix.name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}

      # The nightly's version, in [workspace.package] and so in every crate and Cargo.lock, so
      # `--version` and Help › About Suhina show which night and commit it is.
      - name: Set the nightly version
        if: needs.version.outputs.nightly == 'true'
        shell: bash
        run: |
          perl -pi -e '
            $in = /^\[workspace\.package\]/ if /^\[/;
            $done ||= $in && s/^version = "[^"]*"/version = "$ENV{VERSION}"/;
          ' Cargo.toml
          cargo update --workspace
          set_to=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "suhina-cli") | .version')
          if [ "$set_to" != "$VERSION" ]; then
            echo "::error::the version is $set_to, not $VERSION"
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          # Link the C runtime statically, so the Windows binary does not need the Visual C++
          # redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          TARGETS: ${{ matrix.targets }}
        run: |
          features=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
            features=(--features suhina/asio,suhina-cli/asio)
          fi
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked -p suhina-cli -p suhina -p suhina-plugin-host --target "$target" "${features[@]}"
          done
      - name: Collect the package
        shell: bash
        run: |
          mkdir -p "dist/$PACKAGE"
          case "$RUNNER_OS" in
            Windows)
              for bin in "$BIN" "$APP" "$HOST"; do
                cp "target/x86_64-pc-windows-msvc/release/$bin.exe" "dist/$PACKAGE/"
              done ;;
            macOS)
              for bin in "$BIN" "$APP" "$HOST"; do
                lipo -create -output "dist/$PACKAGE/$bin" \
                  "target/aarch64-apple-darwin/release/$bin" \
                  "target/x86_64-apple-darwin/release/$bin"
                lipo -info "dist/$PACKAGE/$bin"
              done
              # Suhina.app, which Finder opens and which goes to Applications; suhina-cli beside
              # it is a link into it (docs/releasing.md › Packages).
              scripts/macos_app.sh "dist/$PACKAGE" "$VERSION" ;;
            *)
              for bin in "$BIN" "$APP" "$HOST"; do
                cp "target/x86_64-unknown-linux-gnu/release/$bin" "dist/$PACKAGE/"
              done ;;
          esac
          cp LICENSE NOTICE README.md ATTRIBUTION.md "dist/$PACKAGE/"
          # Licences of the code ported from other projects: the FM synth (Apache-2.0) and the
          # time stretcher (MIT).
          cp devices/fm-synth/LICENSE-APACHE crates/stretch/LICENSE-signalsmith.txt "dist/$PACKAGE/"

      - name: Smoke test
        shell: bash
        run: |
          exe="dist/$PACKAGE/$BIN"
          app="dist/$PACKAGE/$APP"
          host="dist/$PACKAGE/$HOST"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; app="$app.exe"; host="$host.exe"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="dist/$PACKAGE/Suhina.app/Contents/MacOS/$APP"
            host="dist/$PACKAGE/Suhina.app/Contents/MacOS/$HOST"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$exe" audio devices > audio-devices.json
            jq -e '.hosts | any(.name == "ASIO")' audio-devices.json
          fi
          output=$("$exe" --version)
          echo "$output"
          if [ "$output" != "$BIN $VERSION" ]; then
            echo "::error::expected '$BIN $VERSION', got '$output'"
            exit 1
          fi
          # A plug-in through the plug-in host found next to the CLI: the VST3 gain built into
          # the host, on a tenth of a second of silence.
          "$exe" plugin run test:vst3 - smoke.wav --seconds 0.1 --tail 0
          test -s smoke.wav
          # The desktop app needs a window, so only its libraries are checked.
          for binary in "$exe" "$app" "$host"; do
            case "$RUNNER_OS" in
              Linux)
                # Only system libraries: libasound is the one a user may have to install.
                ldd "$binary"
                if ldd "$binary" | grep -q "not found"; then exit 1; fi ;;
              macOS)
                otool -L "$binary"
                lipo "$binary" -verify_arch arm64 x86_64 ;;
              Windows)
                # No dependency on the Visual C++ runtime: its DLL names would be in the import
                # table.
                if grep -qaiE "vcruntime140|msvcp140" "$binary"; then
                  echo "::error::$binary needs the Visual C++ runtime"
                  exit 1
                fi ;;
            esac
          done

      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$PACKAGE.zip" "$PACKAGE" > /dev/null
            archive="$PACKAGE.zip"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
            archive="$PACKAGE.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: draft release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and the tags, for the notes (scripts/release_notes.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -l dist
          # The release the notes count from: for a candidate the tag before it, for a release the
          # previous release (its candidates' changes belong to it). None for the first.
          previous=$(git tag --merged "$GITHUB_SHA^" --list 'v*' --sort=-v:refname \
            | { if [[ "$VERSION" == *-* ]]; then cat; else grep -v -- '-' || true; fi; } | head -n 1)
          echo "Notes count from ${previous:-the beginning}."
          changes=$(python3 scripts/release_notes.py --repo "$GITHUB_REPOSITORY" \
            --base "$previous" --head "$GITHUB_SHA" --style release)
          notes=$(cat <<EOF
          Pre-alpha build of the desktop app (\`$APP\`) and the command-line tool (\`$BIN\`). The binaries are not signed.

          <!-- Generated from ROADMAP.md (What works now) and the changes since ${previous:-the beginning}. Edit before publishing. -->

          $changes
          EOF
          )
          flags=()
          # A pre-release never becomes the "latest" release on the repository page.
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            "${flags[@]}" \
            --title "Suhina $VERSION" \
            --notes "$notes"

  # Replaces the previous nightly: its release and its tag go, and the new one is published at once
  # (no draft), on the commit it was built from.
  nightly:
    name: nightly
    needs: [version, build]
    if: needs.version.outputs.nightly == 'true' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # DISCORD_WEBHOOK_RELEASES is in the environment `discord`, which main may use; the nightly
    # runs from main only.
    environment:
      name: discord
      deployment: false
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: false
    steps:
      # The whole history, for the list of changes (scripts/release_notes.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The commit of the nightly being replaced; the changes are counted from it.
      - name: Note the previous nightly
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
          echo "Previous nightly: ${sha:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          DATED: ${{ needs.version.outputs.dated }}
          PREVIOUS: ${{ steps.previous.outputs.sha }}
        run: |
          ls -l dist
          changes=$(python3 scripts/release_notes.py --repo "$GITHUB_REPOSITORY" \
            --base "$PREVIOUS" --head "$GITHUB_SHA" --style nightly)
          notes=$(cat <<EOF
          **A development build, not a release.** Built from \`main\` at $GITHUB_SHA: whatever works there today, unfinished parts and bugs included. Projects saved with it may not open in later builds.

          The desktop app is \`$APP\`; \`$BIN\` is the command-line tool, and \`$HOST\` is the process plug-ins run in, kept in the same folder. The binaries are not signed: macOS and Windows warn before running them. On Linux they need the ALSA library (\`libasound2\`).

          Talk about it on Discord: https://discord.com/invite/e5JAZYMU. Bugs and ideas: https://github.com/$GITHUB_REPOSITORY/issues (say which nightly: \`$VERSION\`).

          $changes
          EOF
          )
          # Until Suhina has a release of its own (published, not a candidate), the nightly is the
          # repository's latest release, so the Releases box on the repository page offers it.
          # From the first release on it is a pre-release that never becomes the latest.
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | length')
          if [ "$releases" = "0" ]; then flags=(--latest); else flags=(--prerelease --latest=false); fi
          echo "Releases of Suhina's own: $releases; nightly published with ${flags[*]}"
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            "${flags[@]}" \
            --title "Suhina nightly $VERSION" \
            --notes "$notes"
          # The same packages under the night's own tag, a pre-release that is never the latest.
          # A second scheduled nightly on the same day has a tag of its own (nightly-YYYYMMDD-2);
          # one run by hand replaces the day's first.
          gh release delete "$DATED" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$DATED" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Suhina nightly $VERSION" \
            --notes "$notes"
      # Deletes the dated nightlies older than NIGHTLY_KEEP_DAYS, with their tags, so the list of
      # releases stays readable. Only tags `nightly-YYYYMMDD` and `nightly-YYYYMMDD-N` are touched; a failure here leaves
      # the new nightly published.
      - name: Delete old dated nightlies
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d "$NIGHTLY_KEEP_DAYS days ago" +%Y%m%d)
          echo "Keeping the dated nightlies from $cutoff on"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E '^nightly-[0-9]{8}(-[0-9]+)?$' || true; } \
            | while read -r tag; do
                day=${tag#nightly-}
                day=${day%%-*}
                if [ "$day" -lt "$cutoff" ]; then
                  echo "Deleting $tag"
                  gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                fi
              done
      # Posts the new nightly to the Discord releases channel, the secret DISCORD_WEBHOOK_RELEASES
      # in the environment `discord` (Discord: channel settings > Integrations > Webhooks); without the secret nothing is
      # posted. A failed post leaves the nightly published.
      - name: Tell Discord
        continue-on-error: true
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DATED: ${{ needs.version.outputs.dated }}
          PREVIOUS: ${{ steps.previous.outputs.sha }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK_RELEASES secret; nothing posted."
            exit 0
          fi
          python3 scripts/release_notes.py --repo "$GITHUB_REPOSITORY" \
            --base "$PREVIOUS" --head "$GITHUB_SHA" --style discord --version "$VERSION" --tag "$DATED" > post.txt
          cat post.txt
          # allowed_mentions: a commit title never pings anyone.
          jq -Rs '{content: ., allowed_mentions: {parse: []}}' post.txt \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
