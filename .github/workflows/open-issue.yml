name: Open issue
run-name: "Open issue: ${{ inputs.title }}"

# Opens an issue as the GitHub App `suhina-bot` (`suhina-bot[bot]`) rather than as the person who
# starts the run. Agent sessions write to GitHub with the account of the person who runs them;
# issues they open through this workflow show the bot as their author (AGENTS.md › Tasks). The
# Discord bot writes as the same App (suhina-daw/suhina-bot#1). A pull request itself, its
# description and its merge stay under the person's account; a review comment on one can be posted
# as the bot through the Comment on pull request workflow (comment-pr.yml).
#
# Start it from Actions › Open issue › Run workflow, with
# `gh workflow run open-issue.yml --json < request.json` (the inputs as JSON on stdin, so a long body
# is not cut off by the command line; AGENTS.md › Tasks), or with the GitHub MCP's
# `actions_run_trigger`. The run prints `OPENED_ISSUE=#<number> <url>` in its log and puts the link
# in its summary; re-running a failed run does not open the issue twice.
#
# Only an account with write access can start it; GitHub answers anyone else's dispatch with
# `HTTP 403: Must have admin rights to Repository`. Without write access an agent opens the issue
# under the person's own account instead: scripts/agent_post.py checks the access and takes the
# right path (AGENTS.md › Tasks).
#
# The actions are pinned to commits (the tag in the comment beside each): this job holds the App's
# private key, and a tag can be moved to other code.
#
# Setup, by a maintainer only: the App `suhina-bot` has Repository permissions › Issues: Read and
# write, Pull requests: Read and write (for comment-pr.yml), Organization permissions › Projects:
# Read and write, and is installed on this repository only. The environment `suhina-bot` (Settings › Environments),
# limited to the `main` branch, holds its public Client ID in the variable SUHINA_BOT_CLIENT_ID and a private key in the secret
# SUHINA_BOT_PRIVATE_KEY.
on:
  workflow_dispatch:
    inputs:
      title:
        description: Title (at most 256 characters)
        required: true
        type: string
      body:
        description: Body in Markdown (at most 60 000 characters)
        required: true
        type: string
      type:
        description: Type; adds its label and sets the issue type
        required: true
        type: choice
        options: [enhancement, bug, documentation, chore, epic]
      labels:
        description: Other labels, comma-separated (areas, platforms), e.g. "ui, engine"
        required: false
        type: string
        default: ""
      parent:
        description: Number of an open epic to add the issue under (optional)
        required: false
        type: string
        default: ""

# The workflow's own token only reads: the actor's permission, labels and the parent issue. The issue
# is written with the App's token.
permissions:
  contents: read
  issues: read

jobs:
  open:
    runs-on: ubuntu-latest
    environment: suhina-bot
    steps:
      # Everything the run was given is checked before the App's key is touched. Inputs reach the
      # scripts only through `env`, never interpolated into a script.
      - name: Check the inputs and who started the run
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          TYPE: ${{ inputs.type }}
          LABELS: ${{ inputs.labels }}
          PARENT: ${{ inputs.parent }}
          # Only whether the Client ID and private key are set; the values stay out of this step.
          HAS_SUHINA_BOT_CLIENT_ID: ${{ vars.SUHINA_BOT_CLIENT_ID != '' }}
          HAS_SUHINA_BOT_PRIVATE_KEY: ${{ secrets.SUHINA_BOT_PRIVATE_KEY != '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const fail = (message) => { core.setFailed(message); throw new Error(message); };

            for (const name of ["SUHINA_BOT_CLIENT_ID", "SUHINA_BOT_PRIVATE_KEY"]) {
              if (process.env[`HAS_${name}`] !== "true") {
                fail(`The variable or secret ${name} is missing from the environment suhina-bot.`);
              }
            }

            // Starting a workflow already needs write access; this says so in the run as well.
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: context.actor,
            });
            // `permission` is the base level (a custom role or maintain reads as write); `role_name`
            // can be a custom role's own name.
            if (!["admin", "write"].includes(permission.permission)) {
              fail(`@${context.actor} has no write access to ${owner}/${repo}.`);
            }

            const title = process.env.TITLE.trim();
            const body = process.env.BODY;
            if (title.length === 0 || title.length > 256) fail("The title must be 1 to 256 characters.");
            if (body.trim().length === 0 || body.length > 60000) fail("The body must be 1 to 60 000 characters.");

            // The type: its label, and the organization's issue type it maps to (none for an epic).
            const TYPES = { enhancement: "Feature", bug: "Bug", documentation: "Task", chore: "Task", epic: null };
            const type = process.env.TYPE;
            if (!(type in TYPES)) fail(`Unknown type "${type}".`);

            const labels = [type];
            for (const raw of process.env.LABELS.split(",")) {
              const label = raw.trim();
              if (label === "") continue;
              if (!/^[a-z0-9][a-z0-9 .:-]{0,49}$/.test(label)) fail(`"${label}" is not a plain label name.`);
              if (label in TYPES) fail(`"${label}" is a type; give it as the type input instead.`);
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status === 404) fail(`The label "${label}" does not exist.`);
                throw error;
              }
              if (!labels.includes(label)) labels.push(label);
            }

            let parent = null;
            const parentInput = process.env.PARENT.trim().replace(/^#/, "");
            if (parentInput !== "") {
              if (!/^[0-9]{1,7}$/.test(parentInput)) fail(`"${parentInput}" is not an issue number.`);
              const { data: epic } = await github.rest.issues.get({ owner, repo, issue_number: Number(parentInput) });
              if (epic.pull_request) fail(`#${parentInput} is a pull request, not an epic.`);
              if (epic.state !== "open") fail(`#${parentInput} is closed.`);
              if (!epic.labels.some((l) => (typeof l === "string" ? l : l.name) === "epic")) {
                fail(`#${parentInput} is not labelled epic.`);
              }
              parent = epic.number;
            }

            core.setOutput("request", JSON.stringify({ title, labels, issueType: TYPES[type], parent }));

      - name: Token of the suhina-bot App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUHINA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUHINA_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Open the issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUEST: ${{ steps.check.outputs.request }}
          BODY: ${{ inputs.body }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const { title, labels, issueType, parent } = JSON.parse(process.env.REQUEST);

            // A run that is re-run after it opened the issue (adding it under the epic failed, say)
            // does not open it twice: the issue carries the run's id, and an issue of the App's with
            // it is the one this run opened.
            // Every page of the App's issues, newest first, until the marked one turns up.
            const marker = `<!-- open-issue run ${context.runId} -->`;
            const [found] = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, creator: "suhina-bot[bot]", state: "all", sort: "created", direction: "desc", per_page: 100 },
              (response, done) => {
                const hit = response.data.find((i) => !i.pull_request && (i.body || "").endsWith(marker));
                if (hit) done();
                return hit ? [hit] : [];
              },
            );
            let issue = found;
            if (!issue) {
              const payload = { owner, repo, title, body: `${process.env.BODY}\n\nOn behalf of @${context.actor}\n\n${marker}`, labels };
              if (issueType) payload.type = issueType;
              ({ data: issue } = await github.request("POST /repos/{owner}/{repo}/issues", payload));
            }

            // Said before anything else can fail, so a failed run that did open the issue still
            // names it and nobody starts the workflow again for the same issue.
            console.log(`OPENED_ISSUE=#${issue.number} ${issue.html_url}`);
            core.setOutput("number", issue.number);
            core.setOutput("url", issue.html_url);
            core.summary.addRaw(`Opened [#${issue.number} ${issue.title}](${issue.html_url})`);

            if (parent !== null) {
              try {
                const children = await github.paginate("GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues", {
                  owner, repo, issue_number: parent, per_page: 100,
                });
                if (!children.some((child) => child.id === issue.id)) {
                  await github.request("POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues", {
                    owner, repo, issue_number: parent, sub_issue_id: issue.id,
                  });
                }
                core.summary.addRaw(` under #${parent}.`);
              } catch (error) {
                core.summary.addRaw(`, but adding it under #${parent} failed: ${error.message}`);
                await core.summary.write();
                core.setFailed(`Opened #${issue.number}, but adding it under #${parent} failed: ${error.message}`);
                return;
              }
            } else {
              core.summary.addRaw(".");
            }
            await core.summary.write();
