name: Ready to merge

# The label `ready to merge` is a maintainer's decision that a pull request may go in. This
# workflow does the rest: it approves the commit the label was added on and turns on *merge when
# ready* for that commit, so the merge queue takes the pull request once every required check is
# green, with no other click. A red check stops it there. See docs/releasing.md › Merging many pull
# requests.
#
# - Labelled by a maintainer: the app approves the head commit as the event saw it (main's rule
#   needs one approval, and a maintainer cannot approve their own pull request), then enables
#   auto-merge with that commit as the expected head, so a commit pushed in between is never what
#   gets merged. Adding the label is the maintainer's approval of that head, for any author, but
#   only with a test build of it: a successful, authorized `test build` run whose artifacts are
#   still available, for that head or for a head it reaches by merging only main
#   (scripts/build_reuse.py, the lookup /test-build uses). Without one the label comes off with a
#   comment asking for /test-build; a build that is still running counts as none yet. A pull
#   request that changes nothing test-build.yml's paths filter builds needs none.
# - A push by anyone but a maintainer takes the label off, turns auto-merge off and leaves the
#   pull request out of the queue: the new commits wait for a maintainer to read them, as the
#   `test-build` label does (test-build-links.yml, job `unlabel`). main's rule dismisses the
#   approval of the older commit. A maintainer's push keeps the label: the app approves the new
#   head and enables auto-merge for it again.
# - The label taken off, by hand or by the job above: auto-merge off, out of the queue, and the
#   app's approvals dismissed, so the label and the approval come and go together.
#
# pull_request_target runs this file as it is on main, and it never checks out or runs the pull
# request's code: it only calls the GitHub API with numbers and commit ids from the event.
#
# It acts with a short-lived token of the repository's GitHub App (the one docs-generated.yml
# pushes with), not GITHUB_TOKEN: GitHub starts no workflows for a merge made through
# GITHUB_TOKEN, and the workflows on main must run after every merge. Setup: the app has
# Repository permissions › Contents, Pull requests and Issues: Read and write; its public
# Client ID is the DOCS_BOT_CLIENT_ID variable and its key the DOCS_BOT_PRIVATE_KEY secret in `docs-bot`
# (pull_request_target runs on main, which the environment allows); Settings › General › Allow
# auto-merge is on. The queue merges as the app, and GitHub closes the issues a description
# closes (`Closes #N`) as the one who merged: without Issues, they stay open and nothing reports it.
# A permission added to the app reaches the token only once the organisation's installation
# accepts it (Settings › GitHub Apps › suhina-docs-bot › Configure › Accept new permissions).

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize]

permissions: {}

# No concurrency group: a group keeps one waiting run and drops the others, and every event here
# must be handled. A push that lands while a run approves is caught by --match-head-commit.

env:
  # All workflows read the repository variable MAINTAINERS.
  MAINTAINERS: ${{ vars.MAINTAINERS }}
  LABEL: ready to merge
  # Shell functions the jobs source: whether the pull request has the label now (not as the event
  # saw it), and stopping a merge: auto-merge off when it is on, and out of the queue when it is in
  # it. Either call failing fails the job, so a merge is never left running without anyone seeing.
  HELPERS: |
    has_label() {
      gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" --jq '.[].name' | grep -Fxq -- "$LABEL"
    }
    stop_merge() {
      state=$(gh api graphql \
        -f query='query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { id isInMergeQueue autoMergeRequest { enabledAt } } } }' \
        -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F number="$NUMBER" \
        --jq '.data.repository.pullRequest | "\(.id) \(.isInMergeQueue) \(.autoMergeRequest != null)"')
      read -r id queued auto <<< "$state"
      if [ "$auto" = "true" ]; then
        gh api graphql -f query='mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }' \
          -f id="$id" >/dev/null
      fi
      if [ "$queued" = "true" ]; then
        gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' \
          -f id="$id" >/dev/null
      fi
    }

jobs:
  roles:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      sender: ${{ steps.roles.outputs.sender }}
      actor: ${{ steps.roles.outputs.actor }}
    steps:
      - id: roles
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAINTAINERS: ${{ vars.MAINTAINERS }}
        with:
          script: |
            const maintainers = String(process.env.MAINTAINERS || '').split(/[\s,]+/).map(s => s.replace(/^@/, '').toLowerCase()).filter(Boolean);
            const member = login => maintainers.includes(String(login || '').toLowerCase());
            core.setOutput('sender', member(context.payload.sender?.login));
            core.setOutput('actor', member(context.actor));

  queue:
    needs: roles
    name: approve and queue
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'ready to merge') ||
      (github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'ready to merge') &&
        needs.roles.outputs.sender == 'true')
    runs-on: ubuntu-latest
    environment: docs-bot
    # Read-only token for the build lookup; writes go through the app's token.
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      # main's automation only: the pull request's files are never checked out or run here.
      - name: Check out default-branch automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Find a test build of the head
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: '{"command": "test-build", "sha": "${{ github.event.pull_request.head.sha }}", "number": ${{ github.event.pull_request.number }}}'
          TRUSTED_CONTRIBUTORS: ${{ vars.TRUSTED_CONTRIBUTORS }}
        run: |
          build=$(python3 scripts/build_reuse.py)
          echo "result=$build" >> "$GITHUB_OUTPUT"
      - name: Token of the app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
      - name: Approve the commit and turn on merge when ready
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SENDER: ${{ github.event.sender.login }}
          BUILD: ${{ steps.build.outputs.result }}
        run: |
          eval "$HELPERS"
          is_maintainer() {
            printf '%s' "$MAINTAINERS" | tr ',[:space:]' '\n' | sed 's/^@//' | tr '[:upper:]' '[:lower:]' | grep -Fxq -- "${1,,}"
          }
          if ! is_maintainer "$SENDER"; then
            gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
            echo "::notice::$SENDER is not a maintainer; the label was taken off."
            exit 0
          fi
          # Nothing merges without a finished test build of this head (or of the head it updated
          # with main only). A lookup that failed has already failed the job, label kept.
          state=$(printf '%s' "$BUILD" | jq -r --arg sha "$SHA" 'if .head == $sha then .state // "" else "" end')
          # no-binary: test-build.yml never runs for this change (documentation, scripts or other
          # workflows only), so there is no build to wait for.
          if [ "$state" != "ready" ] && [ "$state" != "no-binary" ]; then
            gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
            gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "\`$LABEL\` needs a finished test build of ${SHA:0:7}: comment \`/test-build\`, wait for the build to succeed, then add \`$LABEL\` again (CONTRIBUTING.md › Merging many pull requests)."
            echo "::notice::No finished test build of ${SHA:0:7}; the label was taken off."
            exit 0
          fi
          # The maintainer's label approves this exact head. CODEOWNERS and all required checks
          # still gate the merge queue.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews" \
            -f commit_id="$SHA" -f event=APPROVE \
            -f body="\`$LABEL\`: a maintainer read ${SHA:0:7}; merge when every check is green." >/dev/null
          # Turned off first, so a maintainer's push moves the expected head to the new commit.
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
          # Runs are not serialised (a concurrency group would drop waiting events), so the label
          # is read again here: a run that waited must not undo a maintainer taking it off.
          if ! has_label; then
            echo "::notice::The label was taken off while this run waited; nothing queued."
            exit 0
          fi
          # With main's merge queue this adds the pull request to the queue once it is mergeable;
          # --match-head-commit refuses if the head is no longer the commit approved above.
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$SHA"
          # Taken off between the read above and the merge call: the `stop` run may already have
          # finished, so stop the merge here too.
          if ! has_label; then
            stop_merge
            echo "::notice::The label was taken off while this run queued; the merge was stopped."
          fi

  unlabel:
    needs: roles
    name: take the label off new commits
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'ready to merge') &&
      needs.roles.outputs.sender != 'true'
    runs-on: ubuntu-latest
    environment: docs-bot
    steps:
      - name: Token of the app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
      # Taking the label off starts the `stop` job below, which turns auto-merge off.
      - name: Remove the label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"

  stop:
    name: stop the merge
    if: github.event.action == 'unlabeled' && github.event.label.name == 'ready to merge'
    runs-on: ubuntu-latest
    environment: docs-bot
    steps:
      - name: Token of the app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
      - name: Turn off merge when ready, leave the queue, dismiss the approvals
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          APP: ${{ steps.app-token.outputs.app-slug }}
        run: |
          eval "$HELPERS"
          # Added again since: the newer `labeled` run decides.
          if has_label; then
            echo "::notice::The label is back on; nothing stopped."
            exit 0
          fi
          stop_merge
          # main's rule restricts no one from dismissing reviews, so the app may dismiss its own.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews" \
            --jq ".[] | select(.user.login == \"$APP[bot]\" and .state == \"APPROVED\") | .id" |
          while read -r review; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews/$review/dismissals" \
              -f message="\`$LABEL\` was taken off." -f event=DISMISS >/dev/null
          done
          # Put back while this run stopped the merge: the newer `labeled` run may have queued it
          # and been undone above. The pull request now waits rather than merging; say so.
          if has_label; then
            echo "::error::The label was added again while the merge was being stopped. Take \`$LABEL\` off and add it again to queue the pull request."
            exit 1
          fi
