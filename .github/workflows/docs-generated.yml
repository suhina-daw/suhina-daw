name: Generated docs

# Regenerates, on main after every merge, and commits when they changed:
#   - docs/commands.md, from the command registry;
#   - last_verified in the front matter of every document changed since it was last set
#     (scripts/docs.py stamp);
#   - docs/features.md and the two feature figures, from docs/features.json and the issues of each
#     `area:` label (scripts/features.py); also once a day, so closed issues show without a merge;
#   - docs/INDEX.md, from the documents' front matter.
# Pull requests leave all of them alone, so two pull requests never conflict on them (issue #462).
#
# Two jobs, so the key that may push to main never shares a machine with code from the repository
# or its dependencies (build scripts, proc macros): `generate` builds and writes the files with no
# secrets; `publish` runs only git, copies exactly those files and pushes them.
#
# The push uses a short-lived token of the GitHub App `suhina-docs-bot`, which the main ruleset
# lets bypass pull requests (the organisation does not allow deploy keys). Setup: the app has
# Repository permissions › Contents: Read and write and is installed on this repository only; the
# environment `docs-bot` (Settings › Environments), limited to the `main` branch, holds its public
# Client ID in the variable DOCS_BOT_CLIENT_ID and a private key in the secret DOCS_BOT_PRIVATE_KEY;
# the app is on the bypass list of the main ruleset (Always). Without either, files are not pushed.
# ready-to-merge.yml uses the same app and environment, and needs Pull requests and Issues: Read
# and write too.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # scripts/features.py reads the issues and the open pull requests.
  issues: read
  pull-requests: read

# One run at a time, in order; a run that finds main moved on leaves the work to the newer run.
concurrency:
  group: docs-generated
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `docs.py stamp` reads each document's history; a shallow clone would date them all.
          fetch-depth: 0
      - name: Install ALSA headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: docs/commands.md
        run: cargo run --quiet -p suhina-cli -- commands --markdown > docs/commands.md
      - name: last_verified of the documents changed on main
        run: python3 scripts/docs.py stamp
      - name: The feature list and figures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/features.py
      - name: docs/INDEX.md
        run: python3 scripts/docs.py index --write
      # Every document, since `stamp` may change any of them; publish copies back only the ones
      # that differ and checks what changed in them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-docs
          path: |
            docs/**/*.md
            docs/features-by-area.svg
            docs/features-by-area-dark.svg
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment: docs-bot
    env:
      HAS_APP: ${{ vars.DOCS_BOT_CLIENT_ID != '' && secrets.DOCS_BOT_PRIVATE_KEY != '' }}
    steps:
      # A token that lives for this run only, scoped to this repository's contents.
      - name: Token of the docs bot app
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-docs
          path: ${{ runner.temp }}/generated
      - name: Commit and push when they changed
        env:
          GENERATED: ${{ runner.temp }}/generated
        run: |
          for name in INDEX.md commands.md features.md features-by-area.svg features-by-area-dark.svg; do
            source="$GENERATED/$name"
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              echo "::error::$name is missing from the generated files or is not a regular file."
              exit 1
            fi
            cp "$source" "docs/$name"
          done
          # Other documents: only ones already tracked, whose last_verified `stamp` may have moved.
          # find -type f lists regular files only, never a link.
          (cd "$GENERATED" && find . -type f -name '*.md' -print0) | while IFS= read -r -d '' rel; do
            rel=${rel#./}
            case "$rel" in INDEX.md|commands.md|features.md) continue ;; esac
            if git --literal-pathspecs ls-files --error-unmatch -- "docs/$rel" >/dev/null 2>&1 && [ ! -L "docs/$rel" ]; then
              cmp -s "$GENERATED/$rel" "docs/$rel" || cp "$GENERATED/$rel" "docs/$rel"
            fi
          done
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then
            echo "Generated documentation is current."
            exit 0
          fi
          # Only modified (" M") or new ("??") files, never a deletion or a rename, and only the
          # files generated above; any other document only modified.
          if printf '%s\n' "$changed" | grep -Ev '^( M|\?\?) docs/(INDEX|commands|features)\.md$|^( M|\?\?) docs/features-by-area(-dark)?\.svg$|^ M docs/.*\.md$'; then
            echo "::error::Only the generated docs and last_verified dates may change (above: anything else)."
            exit 1
          fi
          # In those other documents, nothing but the last_verified line.
          other=$(git diff -U0 -- 'docs/*.md' ':!docs/INDEX.md' ':!docs/commands.md' ':!docs/features.md' \
            | grep -E '^[-+]' | grep -Ev '^(\+\+\+|---) ' \
            | grep -Ev '^[-+]last_verified: [0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)
          if [ -n "$other" ]; then
            printf '%s\n' "$other"
            echo "::error::A document changed in more than its last_verified line (above)."
            exit 1
          fi
          git diff --stat
          if [ "$HAS_APP" != "true" ]; then
            echo "::warning::DOCS_BOT_CLIENT_ID or DOCS_BOT_PRIVATE_KEY is not set in the docs-bot environment, so the files are not pushed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INDEX.md docs/commands.md docs/features.md docs/features-by-area.svg \
            docs/features-by-area-dark.svg
          git add -u -- 'docs/*.md'
          # The subject starts "Docs: regenerate", which `docs.py stamp` skips (scripts/docs.py).
          git commit -m "Docs: regenerate INDEX.md, commands.md, the feature list and figures, and last_verified dates"
          if ! git push origin HEAD:main; then
            echo "::notice::main moved on during this run; the run for the newer commit regenerates the files."
          fi
