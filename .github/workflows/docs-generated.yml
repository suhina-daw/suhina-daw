name: Generated docs

# Regenerates, on main after every merge, and commits when they changed:
#   - docs/commands.md, from the command registry;
#   - last_verified in the front matter of every document changed since it was last set
#     (scripts/docs.py stamp);
#   - the marked parts of the parity report, from scripts/parity/score.py, devices.json and the
#     command count of docs/commands.md (scripts/parity/update_report.py);
#   - docs/INDEX.md, from the documents' front matter;
#   - the parity figures, from scripts/parity/.
# Pull requests leave all of them alone, so two pull requests never conflict on them (issue #462).
# A pull request changes only the inputs; ci.yml checks that they render.
#
# None of it needs a copy of the manual: the numbers it was read for are recorded in
# scripts/parity/score.py. See docs/research/parity-live-12.md › Reproducing.
#
# Two jobs, so the key that may push to main never shares a machine with code from the repository
# or its dependencies (build scripts, proc macros): `generate` builds and writes the files with no
# secrets; `publish` runs only git, copies exactly those files and pushes them.
#
# The push uses a short-lived token of the GitHub App `suhina-docs-bot`, which the main ruleset
# lets bypass pull requests (the organisation does not allow deploy keys). Setup: the app has
# Repository permissions › Contents: Read and write and is installed on this repository only; the
# environment `docs-bot` (Settings › Environments), limited to the `main` branch, holds its public
# Client ID in the variable DOCS_BOT_CLIENT_ID and a private key in the secret DOCS_BOT_PRIVATE_KEY;
# the app is on the bypass list of the main ruleset (Always). Without either, files are not pushed.
# ready-to-merge.yml uses the same app and environment, and needs Pull requests: Read and write too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, in order; a run that finds main moved on leaves the work to the newer run.
concurrency:
  group: docs-generated
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `docs.py stamp` reads each document's history; a shallow clone would date them all.
          fetch-depth: 0
      - name: Install ALSA headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: docs/commands.md
        run: cargo run --quiet -p suhina-cli -- commands --markdown > docs/commands.md
      - name: last_verified of the documents changed on main
        run: python3 scripts/docs.py stamp
      # After commands.md, whose rows it counts for the command count.
      - name: The parity report's marked parts
        run: python3 scripts/parity/update_report.py
      - name: docs/INDEX.md
        run: python3 scripts/docs.py index --write
      # The parity figures: pure Python over the recorded numbers, so they cannot drift from the
      # numbers the report's marked parts are rendered from.
      - name: Parity figures
        run: |
          # Pinned so the figures are byte-for-byte the same between runs; a newer matplotlib draws
          # slightly different pixels, and an unpinned one would make the bot commit new PNGs for
          # nothing. Raise it on purpose, in a pull request of its own.
          python3 -m pip install --quiet --disable-pip-version-check matplotlib==3.10.9
          python3 scripts/parity/charts.py
      # Every document, since `stamp` may change any of them; publish copies back only the ones
      # that differ and checks what changed in them.
      - uses: actions/upload-artifact@v7
        with:
          name: generated-docs
          path: |
            docs/**/*.md
            docs/research/parity-live-12-by-area.png
            docs/research/parity-live-12-overview.png
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment: docs-bot
    env:
      HAS_APP: ${{ vars.DOCS_BOT_CLIENT_ID != '' && secrets.DOCS_BOT_PRIVATE_KEY != '' }}
    steps:
      # A token that lives for this run only, scoped to this repository's contents.
      - name: Token of the docs bot app
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: generated-docs
          path: ${{ runner.temp }}/generated
      - name: Commit and push when they changed
        env:
          GENERATED: ${{ runner.temp }}/generated
        run: |
          for name in INDEX.md commands.md research/parity-live-12.md; do
            source="$GENERATED/$name"
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              echo "::error::$name is missing from the generated files or is not a regular file."
              exit 1
            fi
            cp "$source" "docs/$name"
          done
          # Other documents: only ones already tracked, whose last_verified `stamp` may have moved.
          # find -type f lists regular files only, never a link.
          (cd "$GENERATED" && find . -type f -name '*.md' -print0) | while IFS= read -r -d '' rel; do
            rel=${rel#./}
            case "$rel" in INDEX.md|commands.md|research/parity-live-12.md) continue ;; esac
            if git --literal-pathspecs ls-files --error-unmatch -- "docs/$rel" >/dev/null 2>&1 && [ ! -L "docs/$rel" ]; then
              cmp -s "$GENERATED/$rel" "docs/$rel" || cp "$GENERATED/$rel" "docs/$rel"
            fi
          done
          # upload-artifact keeps the path below the files' common root, which is docs/ here.
          for name in parity-live-12-by-area.png parity-live-12-overview.png; do
            source="$GENERATED/research/$name"
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              echo "::error::research/$name is missing from the generated files or is not a regular file."
              exit 1
            fi
            cp "$source" "docs/research/$name"
          done
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then
            echo "Generated documentation is current."
            exit 0
          fi
          # Only modified (" M") or new ("??") files, never a deletion or a rename, and only the
          # files generated above; any other document only modified.
          if printf '%s\n' "$changed" | grep -Ev '^( M|\?\?) docs/(INDEX|commands)\.md$|^( M|\?\?) docs/research/parity-live-12-(by-area|overview)\.png$|^ M docs/.*\.md$'; then
            echo "::error::Only the generated docs, the parity report, the parity figures and last_verified dates may change (above: anything else)."
            exit 1
          fi
          # In those other documents, nothing but the last_verified line.
          other=$(git diff -U0 -- 'docs/*.md' ':!docs/INDEX.md' ':!docs/commands.md' ':!docs/research/parity-live-12.md' \
            | grep -E '^[-+]' | grep -Ev '^(\+\+\+|---) ' \
            | grep -Ev '^[-+]last_verified: [0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)
          if [ -n "$other" ]; then
            printf '%s\n' "$other"
            echo "::error::A document changed in more than its last_verified line (above)."
            exit 1
          fi
          # In the parity report, the marked parts and last_verified only: with both left out, the
          # committed and the regenerated report are the same text.
          outside='s/<!-- parity:begin ([a-z0-9-]+) -->.*?<!-- parity:end -->/<$1>/gs; s/^last_verified: .*$//m'
          if ! cmp -s <(git show HEAD:docs/research/parity-live-12.md | perl -0pe "$outside") \
              <(perl -0pe "$outside" docs/research/parity-live-12.md); then
            echo "::error::The parity report changed outside its marked parts."
            exit 1
          fi
          git diff --stat
          if [ "$HAS_APP" != "true" ]; then
            echo "::warning::DOCS_BOT_CLIENT_ID or DOCS_BOT_PRIVATE_KEY is not set in the docs-bot environment, so the files are not pushed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INDEX.md docs/commands.md docs/research/parity-live-12-by-area.png \
            docs/research/parity-live-12-overview.png
          git add -u -- 'docs/*.md'
          # The subject starts "Docs: regenerate", which `docs.py stamp` skips (scripts/docs.py).
          git commit -m "Docs: regenerate INDEX.md, commands.md, the parity report and figures, and last_verified dates"
          if ! git push origin HEAD:main; then
            echo "::notice::main moved on during this run; the run for the newer commit regenerates the files."
          fi
