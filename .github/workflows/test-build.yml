name: Test build

# Packages of a pull request for Windows, macOS and Linux, to download and try without building
# it: the same binaries as the nightly's, uploaded as workflow artifacts kept for 7 days. test-build-links.yml then
# links it from the pull request. See docs/releasing.md › Test builds.
#
# Who gets one: a pull request opened and pushed by a maintainer is built on every push. Any other
# pull request is built when a maintainer adds `test-build`, or the bot adds it for an authorized
# trusted contributor's /test-build request after reading the diff,
# and the build is of the commit the label was added on; a later push takes the label off
# (test-build-links.yml), so new code is never built unreviewed. Running the workflow by hand with
# a list of pull request numbers merges them onto main and builds the result.
#
# A push that only merges main into the pull request ("Update branch") is not built: its own
# changes are those of the build already linked from it (scripts/branch_update.py). The merge
# queue's branches are never built; merge_group is not among the events below on purpose.
#
# The build runs with a read-only token and no secrets. For a pull request from a fork, GitHub runs
# this file as the pull request has it, so the checks that matter are repeated by
# test-build-links.yml, which runs from main.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Only a pull request that changes what goes into the binaries is built; one that changes
    # only documentation, scripts, other workflows or agent files has no new binary to try.
    paths:
      - "apps/**"
      - "crates/**"
      - "devices/**"
      - "presets/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/test-build.yml"
  # main builds nothing to try: `cache` compiles the same binaries to save the Rust cache that pull
  # requests restore. The same paths, so the generated-docs commit after a merge does not run it.
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "crates/**"
      - "devices/**"
      - "presets/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/test-build.yml"
  workflow_dispatch:
    inputs:
      pull_requests:
        description: "Pull request numbers to merge onto main and build together, e.g. 302 303 304"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Faster than the release profile (thin LTO, one codegen unit) at a small cost in speed; still
  # optimised, with the same static C runtime.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  # Whether this event gets a build. Its name does not start with "test build (", so
  # test-build-links.yml does not count it as one.
  decide:
    name: what to build
    # A maintainer's own pull request on every push; labelled requests are authorized below,
    # and a run by hand (only people who can write to the repository can start one). The
    # maintainers come from the repository variable MAINTAINERS. A push to main only fills the
    # cache (`cache` below).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To find the previous head's run of this workflow.
      actions: read
      issues: read
      pull-requests: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - name: Authorize the labelled commit
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAINTAINERS: ${{ vars.MAINTAINERS }}
        with:
          script: |
            const trusted = [...String(process.env.MAINTAINERS || '').split(/[\s,]+/).map(s => s.replace(/^@/, '').toLowerCase()).filter(Boolean), ...String(process.env.TRUSTED_CONTRIBUTORS || '')
              .split(/[\s,]+/).map(s => s.replace(/^@/, '').toLowerCase())];
            const authorizedBuild = async (actor, number, sha, at, checkMembership = true) => {
              if (String(process.env.MAINTAINERS || '').split(/[\s,]+/).map(s => s.replace(/^@/, '').toLowerCase()).filter(Boolean).includes(String(actor).toLowerCase())) return true;
              if (actor !== 'suhina-bot[bot]') return false;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: number, per_page: 100,
              });
              for (const c of comments) {
                if (c.user?.login !== 'suhina-bot[bot]' || c.user?.type !== 'Bot') continue;
                const proof = String(c.body || '').match(/<!-- trusted-build ([a-f0-9]{40}) ([a-zA-Z0-9-]+) ([0-9]+) -->$/);
                if (!proof || proof[1] !== sha || (checkMembership && !trusted.includes(proof[2].toLowerCase())) ||
                    Date.parse(c.created_at) > Date.parse(at)) continue;
                try {
                  const { data: source } = await github.rest.issues.getComment({ ...context.repo, comment_id: Number(proof[3]) });
                  if (source.user?.type === 'User' && source.user.login.toLowerCase() === proof[2].toLowerCase() &&
                      source.body.trim() === '/test-build' &&
                      source.issue_url === 'https://api.github.com/repos/' + context.repo.owner + '/' + context.repo.repo + '/issues/' + number &&
                      Date.parse(source.updated_at) <= Date.parse(c.created_at)) return true;
                } catch (error) { if (error.status !== 404) throw error; }
              }
              return false;
            };
            const maintainers = String(process.env.MAINTAINERS || '').split(/[\s,]+/).map(s => s.replace(/^@/, '').toLowerCase()).filter(Boolean);
            const member = login => maintainers.includes(String(login || '').toLowerCase());
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('allowed', member(context.actor));
              return;
            }
            if (context.payload.action !== 'labeled') {
              core.setOutput('allowed', member(context.actor) && member(context.payload.pull_request.user.login));
              return;
            }
            if (context.payload.label?.name !== 'test-build') return;
            const pr = context.payload.pull_request;
            // Fork pull_request runs may not receive repository variables. Trust the App's
            // commit-bound proof here; the default-branch gateway and linker check membership.
            if (!(await authorizedBuild(context.actor, pr.number, pr.head.sha, new Date().toISOString(), false))) {
              throw new Error('No authorized test-build request for this commit. Use /test-build on fork PRs.');
            }
            core.setOutput('allowed', true);
      # Every branch and the pull request's merge commit, whose second parent is its head; no
      # code is built or run but scripts/branch_update.py.
      - uses: actions/checkout@v7
        if: steps.authorize.outputs.allowed == 'true' && github.event.action == 'synchronize'
        with:
          fetch-depth: 0
          persist-credentials: false
      # Skipped only when the push merged main and nothing else into a head whose run succeeded
      # (built, or skipped the same way): a failed or cancelled build is never left as the last one.
      - id: decide
        if: steps.authorize.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A pull request labelled `test-build-windows` is built for Windows only, to keep the
          # shared runners free when only that platform is being tried.
          WINDOWS_ONLY: ${{ contains(github.event.pull_request.labels.*.name, 'test-build-windows') }}
        run: |
          # As release.yml: the oldest supported Ubuntu, so the binary runs on older glibc too;
          # macOS builds both architectures, joined into one universal binary with lipo.
          linux='{"name":"linux-x86_64","os":"ubuntu-22.04","targets":"x86_64-unknown-linux-gnu"}'
          windows='{"name":"windows-x86_64","os":"windows-latest","targets":"x86_64-pc-windows-msvc"}'
          macos='{"name":"macos-universal","os":"macos-latest","targets":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          if [ "$WINDOWS_ONLY" = true ]; then
            echo "matrix={\"include\":[$windows]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux,$windows,$macos]}" >> "$GITHUB_OUTPUT"
          fi
          build=true
          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ]; then
            if python3 scripts/branch_update.py "$BEFORE" "$HEAD_SHA" origin/main; then
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test-build.yml/runs?event=pull_request&head_sha=$BEFORE" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' || echo 0)
              if [ "${passed:-0}" -gt 0 ]; then
                echo "The build of ${BEFORE::7} stays the one to try."
                build=false
              else
                echo "${BEFORE::7} has no successful test build, so this head is built."
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo "Not built: ${HEAD_SHA::7} only merges main; the pull request's test build of ${BEFORE::7} is still current." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: test build (${{ matrix.name }})
    needs: decide
    if: needs.decide.outputs.build == 'true'
    strategy:
      fail-fast: false
      # Linux, Windows and macOS, or Windows alone (`decide`).
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    # A newer push to the same pull request replaces a build still running, per platform.
    concurrency:
      group: test-build-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.name }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      # The merge of the pull request's head into main as it was when the event happened
      # (github.sha), so a push after the label is not what gets built.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check that the head is the one the event was for
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          parents=$(git show -s --format=%P HEAD)
          echo "Building $(git rev-parse HEAD), parents $parents"
          case " $parents " in
            *" $HEAD_SHA "*) ;;
            *) echo "::error::the merge commit is not of the pull request's head $HEAD_SHA"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the pull requests onto main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PULL_REQUESTS: ${{ inputs.pull_requests }}
        run: |
          git config user.name "Suhina test build"
          git config user.email "test-build@users.noreply.github.com"
          numbers=$(echo "$PULL_REQUESTS" | tr ',#' '  ')
          for n in $numbers; do
            if ! [[ "$n" =~ ^[1-9][0-9]{0,6}$ ]]; then
              echo "::error::'$n' is not a pull request number"
              exit 1
            fi
          done
          merged=""
          for n in $numbers; do
            git fetch --quiet origin "pull/$n/head"
            if ! git merge --no-edit --quiet FETCH_HEAD -m "Test build: merge #$n"; then
              echo "::error::#$n does not merge cleanly onto main${merged:+ with$merged}"
              git merge --abort
              exit 1
            fi
            merged="$merged #$n"
            echo "Merged #$n ($(git rev-parse --short FETCH_HEAD))"
          done

      - name: Name the build
        id: name
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          PULL_REQUESTS: ${{ inputs.pull_requests }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLATFORM: ${{ matrix.name }}
        run: |
          if [ -n "$PR" ]; then
            tag="pr.$PR"
            name="pr$PR"
            commit="${HEAD_SHA::7}"
          else
            numbers=$(echo "$PULL_REQUESTS" | tr ',#' '  ' | xargs | tr ' ' '.')
            tag="prs.$numbers"
            name="prs-${numbers//./-}"
            commit=$(git rev-parse --short=7 HEAD)
          fi
          base=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          # 0.0.1-pr.302+abc1234: which pull request and which of its commits, in --version and
          # Help › About.
          version="${base%%-*}-$tag+$commit"
          echo "Version $version"
          {
            echo "version=$version"
            echo "package=suhina-$name-$PLATFORM"
          } >> "$GITHUB_OUTPUT"

      - name: Install ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      # Restores main's cache (the `cache` job) and saves none: a cache saved here only this pull
      # request could restore, and at 0.6 to 0.8 GB per system these filled the repository's
      # 10 GB and evicted main's caches, ci.yml's among them.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-build-${{ matrix.name }}
          save-if: false

      # As release.yml does for the nightly: the version in [workspace.package], and so in every
      # crate and Cargo.lock; nothing is committed.
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          perl -pi -e '
            $in = /^\[workspace\.package\]/ if /^\[/;
            $done ||= $in && s/^version = "[^"]*"/version = "$ENV{VERSION}"/;
          ' Cargo.toml
          cargo update --workspace

      - name: Build
        shell: bash
        env:
          # As release.yml: the C runtime linked statically on Windows.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked -p suhina-cli -p suhina -p suhina-plugin-host --target "$target"
          done

      - name: Collect and smoke-test the package
        shell: bash
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          mkdir -p "dist/$PACKAGE"
          for bin in suhina-cli suhina suhina-plugin-host; do
            case "$RUNNER_OS" in
              Windows) cp "target/x86_64-pc-windows-msvc/release/$bin.exe" "dist/$PACKAGE/" ;;
              macOS)
                lipo -create -output "dist/$PACKAGE/$bin"                   "target/aarch64-apple-darwin/release/$bin"                   "target/x86_64-apple-darwin/release/$bin" ;;
              *) cp "target/x86_64-unknown-linux-gnu/release/$bin" "dist/$PACKAGE/" ;;
            esac
          done
          # Suhina.app on macOS, as release.yml makes it.
          if [ "$RUNNER_OS" = "macOS" ]; then scripts/macos_app.sh "dist/$PACKAGE" "$VERSION"; fi
          cp LICENSE NOTICE README.md ATTRIBUTION.md "dist/$PACKAGE/"
          cp devices/fm-synth/LICENSE-APACHE crates/stretch/LICENSE-signalsmith.txt "dist/$PACKAGE/"
          exe="dist/$PACKAGE/suhina-cli"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          output=$("$exe" --version)
          echo "$output"
          if [ "$output" != "suhina-cli $VERSION" ]; then
            echo "::error::expected 'suhina-cli $VERSION', got '$output'"
            exit 1
          fi
          "$exe" plugin run test:vst3 - smoke.wav --seconds 0.1 --tail 0
          test -s smoke.wav
          # A workflow artifact is a zip, which drops the executable bit: on Linux and macOS the
          # package goes in as a .tar.gz that keeps it.
          if [ "$RUNNER_OS" != "Windows" ]; then
            tar -czf "dist/$PACKAGE.tar.gz" -C dist "$PACKAGE"
            rm -r "dist/$PACKAGE"
          fi

      # The artifact is a zip: of the package folder on Windows, of its .tar.gz elsewhere.
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ${{ steps.name.outputs.package }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        shell: bash
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
          PACKAGE: ${{ steps.name.outputs.package }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          {
            echo "### Test build $VERSION"
            echo
            echo "[Download $PACKAGE]($URL) (kept for 7 days)"
          } >> "$GITHUB_STEP_SUMMARY"

  # On main: the test build's binaries for each system, built only to save the Rust cache that the
  # pull requests' builds restore. Nothing is packaged or uploaded. The systems, the toolchain
  # targets, MACOSX_DEPLOYMENT_TARGET and RUSTFLAGS must match `build`, or what is restored does
  # not match what a pull request compiles.
  cache:
    name: cache (${{ matrix.name }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    # One run per system at a time; a merge while one runs waits for it instead of cancelling it,
    # since a cancelled run saves nothing. A later merge replaces a waiting one.
    concurrency:
      group: test-build-cache-${{ matrix.name }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-build-${{ matrix.name }}
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked -p suhina-cli -p suhina -p suhina-plugin-host --target "$target"
          done
