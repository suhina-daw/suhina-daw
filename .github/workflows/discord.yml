name: Discord

# Posts pull requests and issues to the Discord events channel, and releases published by a
# person to the releases channel (scripts/discord_post.py says which events and how). The
# nightly is posted by release.yml; it is created with the workflow token, which starts no other
# workflow, so it never reaches this one. See docs/releasing.md › Discord.
#
# Secrets: DISCORD_WEBHOOK_EVENTS and DISCORD_WEBHOOK_RELEASES, each a channel's webhook URL
# (Discord: channel settings > Integrations > Webhooks). A channel without its secret gets nothing.
#
# pull_request_target, so pull requests from forks are posted too: it runs the workflow and the
# script from the base branch with the secrets, and never checks out or runs the pull request's
# code. The event's text reaches the script only as JSON data.
#
# A merged pull request's thread in the testing forum is marked "[Merged]" and archived by the
# bot "Suhina GitHub" (scripts/discord_merged.py): secret DISCORD_BOT_TOKEN, variables
# DISCORD_GUILD_ID and DISCORD_TESTING_FORUM_ID. Without them nothing is done.
on:
  pull_request_target:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]

permissions:
  contents: read

# Events about one item arrive together (an issue is opened and closed, a pull request is merged
# right after it was pushed). A newer event about the same item replaces one that is still waiting,
# so a burst waits as one run per item instead of one per event. A post that is already running is
# never cut off (cancel-in-progress: false): a half-posted notification is one nobody sees. Items
# never share a group, so their posts do not wait for each other either.
concurrency:
  group: discord-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # The base branch, for the script; never the pull request's head.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Post to Discord
        env:
          EVENTS: ${{ secrets.DISCORD_WEBHOOK_EVENTS }}
          RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
        run: |
          post=$(python3 scripts/discord_post.py "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH")
          if [ -z "$post" ]; then
            echo "Not posted: $GITHUB_EVENT_NAME."
            exit 0
          fi
          channel=${post%% *}
          case "$channel" in
            events) webhook=$EVENTS ;;
            releases) webhook=$RELEASES ;;
            *) echo "::error::unknown channel $channel"; exit 1 ;;
          esac
          if [ -z "$webhook" ]; then
            echo "No webhook secret for the $channel channel; nothing posted."
            exit 0
          fi
          echo "${post#* }"
          echo "${post#* }" | curl -fsS -H "Content-Type: application/json" -d @- "$webhook"

  merged-thread:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    # Two renames of a thread in ten minutes; the script waits out a rate limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mark the testing thread merged
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_TESTING_FORUM_ID: ${{ vars.DISCORD_TESTING_FORUM_ID }}
        run: python3 scripts/discord_merged.py "$GITHUB_EVENT_PATH"
