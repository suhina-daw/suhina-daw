name: Parity notice

# A pull request that changes what a user can do updates the parity measurement in the same change
# (AGENTS.md › Before you finish a task). This workflow reminds one that changes `crates/`,
# `devices/` or `apps/` without touching `scripts/parity/score.py` or `scripts/parity/devices.json`
# and whose description does not say `Parity: no change`. It is a warning only and never fails.
#
# It is its own workflow, not a step in ci.yml, so that editing the description (`edited`) runs it
# again without running the build.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: parity-notice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit; its first parent is the base.
          fetch-depth: 2
      # The description goes through an environment variable into a file, never into the script's
      # text, so nothing in it runs as shell.
      - name: The parity measurement is updated or marked as unchanged
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.txt"
          python3 scripts/parity/pr_notice.py --base HEAD^1 --body-file "$RUNNER_TEMP/pr-body.txt"
