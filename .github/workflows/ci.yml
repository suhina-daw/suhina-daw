name: CI

# Pull requests and main run clippy and the tests on Linux, Windows and macOS; GitHub's runners
# are free for an open-source repository. Linux and Windows are part of the required check; macOS
# is reported without blocking merges until it has proven itself. The release workflow builds and
# checks all three for every tag and for the nightly.
#
# merge_group: the merge queue (CONTRIBUTING.md › Merging many pull requests) tests its
# temporary branch, main with the queued pull requests merged onto it, with the same jobs, so the
# `ci` check a ruleset requires reports there too. Jobs that need a pull request skip.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Changes that touch only documentation, scripts/ or .github/ skip the build jobs entirely: no
  # Rust build or test reads these files, and the docs job below, which always runs, tests the
  # scripts. A change to this file still runs every job. main requires only the `ci` job at the
  # end, which passes when the others passed or were skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request is checked out as a merge commit, so its first parent is the current base.
      # A merge queue group is compared with the main it is built on.
      - id: diff
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request' && 'HEAD^1'
              || github.event_name == 'merge_group' && github.event.merge_group.base_sha
              || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE" HEAD \
            | grep -Ev '^docs/|\.md$|^LICENSE$|^NOTICE$|^scripts/|^\.github/' || true)
          if git diff --name-only "$BASE" HEAD | grep -qx '\.github/workflows/ci\.yml'; then
            code=true
          fi
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  # Runs on every change, documentation included.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as a merge commit; its first parent is the base.
          fetch-depth: 2
      # docs/INDEX.md and docs/commands.md are generated on main (docs-generated.yml), not checked here.
      - name: Front matter and covered paths
        run: python3 scripts/docs.py check
      - name: Script tests (release notes)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # The claim bot writes to the project board, so a wrong branch would not fail anything else:
      # its commands are run here against mocked API clients, on the runner's Node.js.
      - name: The claim bot's commands answer as intended
        run: python3 scripts/claim_bot_test.py
      # The Depends on check decides what the merge queue may merge; run it the same way.
      - name: The Depends on check reads descriptions as intended
        run: python3 scripts/depends_on_test.py
      - name: The branch name reminder reads names as intended
        run: python3 scripts/branch_name_test.py
      - name: The description reminder reads descriptions as intended
        run: python3 scripts/pr_description_test.py
      - name: The licence header script adds and checks headers as intended
        run: python3 scripts/license_header_test.py
      # Warnings only: documents that describe code this pull request changes, left unchanged.
      - name: Documents that describe the changed code
        if: github.event_name == 'pull_request'
        run: python3 scripts/docs.py impact HEAD^1
      # docs/INDEX.md and docs/commands.md are generated on main (docs-generated.yml). A pull
      # request that edits one of them would have the edit overwritten on the next merge, silently,
      # so it is refused here instead and sent to the source of the file. The parity report is not
      # in this list: it is a normal document whose prose pull requests edit (see the step below).
      - name: Generated files are not edited by hand
        if: github.event_name == 'pull_request'
        env:
          BASE: HEAD^1
        run: |
          edited=$(git diff --name-only "$BASE" HEAD -- docs/INDEX.md docs/commands.md || true)
          if [ -z "$edited" ]; then
            echo "No generated file is touched."
            exit 0
          fi
          echo "::error::These files are generated on main and an edit here would be overwritten:"
          printf '%s\n' "$edited"
          echo "::error::Edit their source instead: the command registry for docs/commands.md, the documents' front matter for docs/INDEX.md."
          exit 1
      # The parity report's marked parts are written on main after every merge
      # (docs-generated.yml), so a pull request changes only their inputs (score.py,
      # devices.json). This checks that the inputs render and the markers are whole; it passes
      # whether the marked parts are stale or were regenerated in the pull request (issue #462).
      - name: The parity report's inputs render
        run: python3 scripts/parity/update_report.py --check-inputs
      - name: No hidden or bidirectional Unicode characters
        run: |
          if git grep -nIP '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}\x{FEFF}]' -- . ':!*.lock'; then
            echo "::error::Hidden or bidirectional Unicode characters found (listed above)."
            exit 1
          fi
      - name: No Live project or library files
        run: |
          if git ls-files | grep -Ei '\.(als|alc|adg|adv|agr|ams|amxd|asd|alp)$'; then
            echo "::error::Live files are not committed; test sets stay in corpus/ (see CONTRIBUTING.md)."
            exit 1
          fi
      - name: No old project name (AGENTS.md › Crate names)
        run: python3 scripts/rename_suhina.py --check
      - name: Licence header in every source file (AGENTS.md › Licence header)
        run: python3 scripts/license_header.py --check
      - name: No long test modules inside source files (scripts/inline_tests.py)
        run: python3 scripts/inline_tests.py --check
      # third_party/ is vendored unchanged; its README links artwork that was left out on purpose.
      # The generated files are rewritten on main after the merge, so a link they still hold to a
      # document a pull request deletes is mended there; the pull request may not edit them.
      - name: Links between repository files resolve
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path third_party --exclude-path docs/INDEX.md --exclude-path docs/commands.md "**/*.md"
          fail: true

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy and tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers (cpal) and an X server for plug-in editors (Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only main saves; pull requests and the merge queue restore main's cache. The repository's
      # caches share 10 GB, and a save from every pull request push (about 0.8 GB per system)
      # evicted main's, so about half the runs compiled every dependency again (7 to 8 minutes
      # more on Linux).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The corpus tests need Live Sets that are not in the repository, so the `corpus` feature
      # stays off here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The documentation, warnings as errors: a rustdoc link to code that was renamed (the map
      # from the window to its code in crates/ui/src/lib.rs, #768 › 4) fails here. Private items
      # are documented, so links to them resolve.
      - run: cargo doc --workspace --no-deps --document-private-items
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
      # On Linux under a virtual X server, so the plug-in editor tests open real windows.
      - run: cargo test --workspace
        if: runner.os != 'Linux'
      - run: xvfb-run -a cargo test --workspace
        if: runner.os == 'Linux'

  # Not part of `ci`: a macOS failure is reported but does not block merging.
  check-macos:
    name: clippy and tests (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only main saves, as in the job above.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The corpus tests need Live Sets that are not in the repository, so the `corpus` feature
      # stays off here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Pull requests from forks: every commit must carry a Signed-off-by line (Developer
  # Certificate of Origin, CONTRIBUTING.md). Branches of this repository are the maintainers', and
  # so are their commits: a fork's pull request stacked on a branch here carries that branch's
  # commits too, and those are skipped (the full checkout has every branch of this repository).
  # Skipped in the merge queue: its pull requests were checked here before they were queued.
  dco:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            # The checkout's pull/<number>/merge ref contains every PR commit; it is not
            # an upstream branch and must never exempt a fork's own commits.
            if [ -n "$(git branch -r --contains "$commit" --list 'origin/*')" ]; then
              continue
            fi
            author=$(git log -1 --format='%an <%ae>' "$commit")
            if ! git log -1 --format='%B' "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit has no 'Signed-off-by: $author' line (git commit -s)."
              missing=1
            fi
          done
          exit $missing

  # The one check main requires. Fails if any job it depends on failed or was cancelled. It runs
  # on pull requests and in the merge queue alike, so the queue waits on the same check.
  ci:
    if: always()
    needs: [changes, docs, fmt, check, dco]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required job failed or was cancelled."
          exit 1
      - run: echo "All required jobs passed or were skipped."
