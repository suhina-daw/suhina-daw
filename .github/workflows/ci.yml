name: CI

# Pull requests and main run clippy and the tests on Linux, Windows and macOS; GitHub's runners
# are free for an open-source repository. Linux and Windows are part of the required check; macOS
# is reported without blocking merges until it has proven itself. The release workflow builds and
# checks all three for every tag and for the nightly.
#
# merge_group: the merge queue (CONTRIBUTING.md › Merging many pull requests) tests its
# temporary branch, main with the queued pull requests merged onto it, with the same jobs, so the
# `ci` check a ruleset requires reports there too. Jobs that need a pull request skip.
#
# Pull requests merge into the repository's default branch: `next` once it is the default, main
# until then (docs/releasing.md › The next branch). A push to the default branch runs every job and
# saves the caches; a push to main once `next` is the default is the nightly moving main to a commit
# `next` already ran, so it builds nothing.
on:
  push:
    branches: [main, next]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its run. On main a run is never cancelled, since a
# cancelled run saves no cache (Windows, the slowest, once never saved one and every pull request
# compiled every dependency there): the pushes to main share one group, the running run goes to the
# end and only the newest push waits, the ones in between are dropped. Each push to main had a run
# of its own, so a few merges in a row filled the organisation's runners for half an hour with runs
# of commits already superseded (nine jobs each, #1538). The generated-docs commit that follows a
# merge says [skip ci] (docs-generated.yml) and starts no run.
concurrency:
  group: ci-${{ github.event_name == 'push' && format('push-{0}', github.ref_name) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Changes that touch only documentation, scripts/ or .github/ skip the build jobs entirely: no
  # Rust build or test reads these files, and the docs job below, which always runs, tests the
  # scripts. A change to this file still runs every job. main requires only the `ci` job at the
  # end, which passes when the others passed or were skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      pack: ${{ steps.diff.outputs.pack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pull request is checked out as a merge commit, so its first parent is the current base.
      # A merge queue group is compared with the main it is built on.
      - id: diff
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request' && 'HEAD^1'
              || github.event_name == 'merge_group' && github.event.merge_group.base_sha
              || github.event.before }}
          # A push to a branch that is not the default one: main moved to a commit of `next`.
          PROMOTED: ${{ github.event_name == 'push' && github.ref_name != github.event.repository.default_branch }}
        run: |
          if [ "$PROMOTED" = true ]; then
            printf 'code=false\npack=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            printf 'code=true\npack=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --no-renames --name-only "$BASE" HEAD)
          code=$(printf '%s\n' "$changed" \
            | grep -Ev '^docs/|\.md$|^LICENSE$|^NOTICE$|^scripts/|^\.github/' || true)
          if printf '%s\n' "$changed" | grep -qx '\.github/workflows/ci\.yml'; then
            code=true
          fi
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"
          # The shipped pack's data audits (.config/nextest.toml › ci-pr) read the pack, the
          # presets and the two NAM devices with what they are built from; a pull request runs them
          # only when one of these changes. The merge queue and main always run them.
          if printf '%s\n' "$changed" | grep -Eq '^(packs/|presets/|devices/nam-amp-modeler/|devices/nam-cab-loader/|crates/(dsp|device-api|fs|device-registry)/|third_party/nam-rs/|Cargo\.(toml|lock)$|\.config/nextest\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "pack=true"
          else
            echo "pack=false"
          fi >> "$GITHUB_OUTPUT"

  # Runs on every change, documentation included.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit; its first parent is the base.
          fetch-depth: 2
      # docs/INDEX.md and docs/commands.md are generated on main (docs-generated.yml), not checked here.
      - name: Front matter and covered paths
        run: python3 scripts/docs.py check
      # What the updater installs and runs comes from this repository (updater-source.yml runs the
      # same check from main, where a pull request cannot edit it).
      - name: The updater downloads from this repository
        run: python3 scripts/updater_source.py
      - name: Script tests (release notes)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Each file is a ROADMAP bullet that docs-generated.yml folds in on main.
      - name: docs/works-now files
        run: python3 scripts/works_now.py check
      # The claim bot writes to the project board, so a wrong branch would not fail anything else:
      # its commands are run here against mocked API clients, on the runner's Node.js.
      - name: The claim bot's commands answer as intended
        run: python3 scripts/claim_bot_test.py
      # The Depends on check decides what the merge queue may merge; run it the same way.
      - name: The Depends on check reads descriptions as intended
        run: python3 scripts/depends_on_test.py
      - name: The branch name reminder reads names as intended
        run: python3 scripts/branch_name_test.py
      - name: The description reminder reads descriptions as intended
        run: python3 scripts/pr_description_test.py
      - name: The licence header script adds and checks headers as intended
        run: python3 scripts/license_header_test.py
      # Warnings only: documents that describe code this pull request changes, left unchanged.
      - name: Documents that describe the changed code
        if: github.event_name == 'pull_request'
        run: python3 scripts/docs.py impact HEAD^1
      # docs/INDEX.md and docs/commands.md are generated
      # on main (docs-generated.yml). A pull request that edits one of them would have the edit
      # overwritten on the next merge, silently, so it is refused here instead and sent to the
      # source of the file. Adding one (the pull request that introduces it) is not an edit.
      - name: Generated files are not edited by hand
        if: github.event_name == 'pull_request'
        env:
          BASE: HEAD^1
        run: |
          edited=$(git diff --name-only --diff-filter=a "$BASE" HEAD -- docs/INDEX.md docs/commands.md || true)
          if [ -z "$edited" ]; then
            echo "No generated file is touched."
            exit 0
          fi
          echo "::error::These files are generated on main and an edit here would be overwritten:"
          printf '%s\n' "$edited"
          echo "::error::Edit their source instead: the command registry for docs/commands.md, the documents' front matter for docs/INDEX.md, scripts/status_figure.py for the status figures."
          exit 1
      - name: No hidden or bidirectional Unicode characters
        run: |
          if git grep -nIP '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}\x{FEFF}]' -- . ':!*.lock'; then
            echo "::error::Hidden or bidirectional Unicode characters found (listed above)."
            exit 1
          fi
      - name: No Live project or library files
        run: |
          if git ls-files | grep -Ei '\.(als|alc|adg|adv|agr|ams|amxd|asd|alp)$'; then
            echo "::error::Live files are not committed; test sets stay in corpus/ (see CONTRIBUTING.md)."
            exit 1
          fi
      - name: No old project name (docs/architecture.md › Crate names)
        run: python3 scripts/rename_suhina.py --check
      - name: Licence header in every source file (docs/architecture.md › Licence header)
        run: python3 scripts/license_header.py --check
      - name: No long test modules inside source files (scripts/inline_tests.py)
        run: python3 scripts/inline_tests.py --check
      # third_party/ is vendored unchanged; its README links artwork that was left out on purpose.
      # The generated files are rewritten on main after the merge, so a link they still hold to a
      # document a pull request deletes is mended there; the pull request may not edit them.
      - name: Links between repository files resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path third_party --exclude-path docs/INDEX.md --exclude-path docs/commands.md "**/*.md"
          fail: true

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # clippy, the documentation and the vendored code's own tests; the workspace's tests run in the
  # `test` job below, at the same time.
  check:
    name: clippy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # Only main saves; pull requests and the merge queue restore main's cache. The repository's
      # caches share 10 GB, and a save from every pull request push (about 0.8 GB per system)
      # evicted main's, so about half the runs compiled every dependency again (7 to 8 minutes
      # more on Linux).
      # v1: this job's cache from before the tests moved to `test` also held the test build (1.1 to
      # 1.3 GB a system), and the cache is saved only when its key changes, so a new prefix is what
      # makes main save one of clippy's alone; the old ones go unused and GitHub evicts them first.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      # The corpus tests need Live Sets that are not in the repository, so the `corpus` feature
      # stays off here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The vst2 feature is on by default (ADR 0022's amendment), so the workspace steps
      # above check it; this checks that a build opting out still compiles.
      - run: cargo clippy -p suhina-plugin-host --all-targets --no-default-features -- -D warnings
      # third_party/nam-rs is outside the workspace, so the steps above skip its tests: these
      # cover Suhina's changes to it (third_party/nam-rs/VENDORED.md). The published crate leaves
      # out tests/fixtures, which the model_runtime and top-level wavenet tests read.
      - name: Vendored nam-rs (fast tanh, state copy, block kernel)
        run: cargo test --manifest-path third_party/nam-rs/Cargo.toml --lib -- fast_math wavenet::gating wavenet::layer wavenet::conv wavenet::array wavenet::head wavenet::film lstm
      - name: ASIO driver initialization contract
        if: runner.os == 'Windows'
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: cargo test --manifest-path third_party/asio-sys/Cargo.toml --lib driver_info
      - name: ASIO callback cycle contract
        if: runner.os == 'Windows'
        run: |
          rustc --test third_party/cpal/src/host/asio/callback_cycle.rs -o callback-cycle-tests.exe
          ./callback-cycle-tests.exe
      # The ASIO host (the patched cpal backend and the output's driver code) builds only with
      # the `asio` feature, which the workspace steps above leave off: without this step a
      # change there is first compiled by a Windows package build.
      - name: ASIO host code
        if: runner.os == 'Windows'
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: cargo clippy -p suhina-output --all-targets --features asio -- -D warnings
      # The documentation, warnings as errors: a rustdoc link to code that was renamed (the map
      # from the window to its code in crates/ui/src/lib.rs, #768 › 4) fails here. Private items
      # are documented, so links to them resolve.
      - run: cargo doc --workspace --no-deps --document-private-items
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links

  # The workspace's tests, run by cargo-nextest (.config/nextest.toml) in three partitions per
  # system, each on a runner of its own (docs/releasing.md › How CI runs the tests). `cargo test`
  # ran the test binaries one after another, 11 to 19 minutes of a 16 to 22 minute step; nextest
  # runs the tests of every binary side by side, and each partition runs a third of each binary's
  # tests (slice: the tests in order, dealt out in turn). Each partition compiles the tests itself.
  test:
    name: tests (${{ matrix.os }}, ${{ matrix.partition }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        partition: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ALSA headers (cpal) and an X server for plug-in editors (Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The partitions build the same thing, so they share one cache, which the first saves on
      # main (the other two would only race it to the same key).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && matrix.partition == 1 }}
      - name: Install cargo-nextest
        shell: bash
        run: scripts/install_nextest.sh
      # On Linux under a virtual X server, so the plug-in editor tests open real windows.
      # -noreset: without it the X server resets as its last client leaves, and a test that opens
      # the next window at that moment has its connection reset.
      # A pull request that changes none of the pack's inputs leaves out its data audits
      # (.config/nextest.toml › ci-pr); the merge queue and main run them.
      - name: Tests (partition ${{ matrix.partition }} of 3)
        shell: bash
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.pack != 'true' && 'ci-pr' || 'ci' }}
        run: |
          run=(cargo nextest run --workspace --profile "$PROFILE" --partition "slice:${{ matrix.partition }}/3")
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" "${run[@]}"
          else
            "${run[@]}"
          fi
      # The engine's tests again with renderers on 4 threads (ADR 0038 › 16): a render on several
      # threads must equal the render on one, bit for bit. A renderer that finds no free lane of
      # the process's pool (past 16 at once) renders alone, and a block with fewer than 4 chains
      # without plug-ins stays on the render thread. Split like the rest: each partition runs its
      # share.
      - name: Engine tests on 4 render threads (partition ${{ matrix.partition }} of 3)
        # The workspace build the step above made, with the engine's tests picked by a filter: with
        # `-p suhina-engine`, cargo resolves the dependencies' features for the engine alone and
        # compiled a share of them again in every partition.
        run: cargo nextest run --workspace -E "package(suhina-engine)" --profile ci --partition "slice:${{ matrix.partition }}/3"
        env:
          SUHINA_RENDER_THREADS: "4"
      # nextest does not run documentation tests; the first partition runs them with cargo.
      - name: Documentation tests
        if: matrix.partition == 1
        run: cargo test --workspace --doc

  # Not part of `ci`: a macOS failure is reported but does not block merging. One runner: the
  # tests are not split here.
  check-macos:
    name: clippy and tests (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # Only main saves, as in the jobs above.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Install cargo-nextest
        run: scripts/install_nextest.sh
      # The corpus tests need Live Sets that are not in the repository, so the `corpus` feature
      # stays off here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --profile "$PROFILE"
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.pack != 'true' && 'ci-pr' || 'ci' }}
      - run: cargo test --workspace --doc

  # Pull requests from forks: every commit must carry a Signed-off-by line (Developer
  # Certificate of Origin, CONTRIBUTING.md). Branches of this repository are the maintainers', and
  # so are their commits: a fork's pull request stacked on a branch here carries that branch's
  # commits too, and those are skipped (the full checkout has every branch of this repository).
  # Skipped in the merge queue: its pull requests were checked here before they were queued.
  dco:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            # The checkout's pull/<number>/merge ref contains every PR commit; it is not
            # an upstream branch and must never exempt a fork's own commits.
            if [ -n "$(git branch -r --contains "$commit" --list 'origin/*')" ]; then
              continue
            fi
            author=$(git log -1 --format='%an <%ae>' "$commit")
            if ! git log -1 --format='%B' "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit has no 'Signed-off-by: $author' line (git commit -s)."
              missing=1
            fi
          done
          exit $missing

  # Checks that live in workflows of their own, called here so that `ci` goes red with them: main
  # requires only `ci`, and a check from another workflow could fail without stopping a merge.
  # Each keeps its file (its tests and documents read it) and its own run by hand.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/deny.yml
    permissions:
      contents: read
  depends-on:
    uses: ./.github/workflows/depends-on.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
  settings-guide:
    uses: ./.github/workflows/settings-guide.yml
    permissions:
      contents: read

  # The one check main requires. Fails if any job it depends on failed or was cancelled. It runs
  # on pull requests and in the merge queue alike, so the queue waits on the same check.
  ci:
    if: always()
    needs: [changes, docs, fmt, check, test, dco, deny, depends-on, settings-guide]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required job failed or was cancelled."
          exit 1
      - run: echo "All required jobs passed or were skipped."
