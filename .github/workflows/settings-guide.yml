name: Settings guide export

# The settings and shortcuts guide exports are current (docs/spec/settings-guide-export.md). Called
# from ci.yml as its `settings-guide` job, so the `ci` check main requires goes red with it: a check
# of its own, which main did not require, could fail without stopping a merge.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/settings_guide.py --check
      - run: python -m unittest discover -s scripts -p 'test_settings_guide.py'
      - run: python scripts/shortcuts_guide.py --check
      - run: python -m unittest discover -s scripts -p 'test_shortcuts_guide.py'
