# Dependabot (CONTRIBUTING.md › Dependencies). Security updates come as soon as an advisory is
# published (Settings › Code security); these are the weekly version updates. Each pull request
# goes through CI like any other, cargo deny included, and is reviewed before it merges.
version: 2
updates:
  # The whole Cargo workspace (every crate under crates/, devices/ and apps/) from its root.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [chore]
    commit-message:
      prefix: "Deps"
    groups:
      # Minor and patch updates together, and the major ones together in a second pull request
      # (for a 0.x crate, 0.14 to 0.15 is major). Every update rewrites Cargo.lock, so two pull
      # requests in the merge queue at once conflict there; one per kind keeps it to two a week,
      # and a major update that breaks the build is moved out of the group with exclude-patterns.
      cargo-minor:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [chore]
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]
