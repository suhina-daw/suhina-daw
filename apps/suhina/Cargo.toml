[package]
name = "suhina"
description = "Suhina, the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "suhina"
path = "src/main.rs"

[features]
# ASIO on Windows (README › Building): needs libclang and a C++ compiler at build time.
asio = ["suhina-output/asio"]

[dependencies]
# The main window's native handle, for plug-in editors to float above it.
raw-window-handle = "0.6"  # MIT OR Apache-2.0 OR Zlib
suhina-engine.workspace = true
suhina-session.workspace = true
suhina-media.workspace = true
suhina-library.workspace = true
suhina-output.workspace = true
suhina-midi.workspace = true
suhina-plugins.workspace = true
suhina-ui.workspace = true
# The build's endpoints: one instance per build, and agents working on the open projects (ADR 0028).
suhina-automation.workspace = true
suhina-update.workspace = true
suhina-theme-package.workspace = true
chrono.workspace = true
zip.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", features = ["glow", "persistence"] }  # MIT OR Apache-2.0
# The system's own file and folder dialogs (Browse… beside a path field); on Linux through the
# desktop portal, in Rust, with no GTK.
rfd = "0.17"  # MIT

[target.'cfg(target_os = "windows")'.dependencies]
# DWM's acrylic blur behind a see-through window, with no unsafe code here.
window-vibrancy = "0.8"  # MIT OR Apache-2.0

[target.'cfg(target_os = "macos")'.dependencies]
# The system's menu bar on macOS (#650): AppKit's NSMenu, with no unsafe code here.
muda = { version = "0.21", default-features = false }  # MIT OR Apache-2.0

[build-dependencies]
winresource.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Opening the window as an X11 one when an X server is there (eframe's own winit).
winit = { version = "0.30", default-features = false, features = ["x11"] }  # Apache-2.0

[lints]
workspace = true
